  # /logtitularidade — Log de troca de titularidade com dados do titular atual e do novo
  - trigger: "/logtitularidade"
    force_clipboard: true
    replace: "{{resultado}}"
    vars:
      - name: formulario
        type: form
        params:
          layout: |
            Canal: [[canal]]
            Contrato: [[contrato]]
            Tipo perfil atual: [[tipo_atual]]
            Nome/Razão atual: [[nome_atual]]
            Doc atual (CPF/CNPJ): [[doc_atual]]
            Tipo perfil novo: [[tipo_novo]]
            Nome/Razão novo: [[nome_novo]]
            CPF/CNPJ novo: [[cpf_novo]]
            RG/IE novo: [[rg_novo]]
            E-mail novo: [[email_novo]]
            Telefone novo: [[tel_novo]]
            Endereço novo: [[end_novo]]
            Documentos recebidos: [[docs_anexos]]
            Restrição (protesto) do novo titular: [[restricao]]
          fields:
            canal:
              type: choice
              values: *canal_padrao
            tipo_atual:
              type: choice
              values:
                - Pessoa Física
                - Pessoa Jurídica
            tipo_novo:
              type: choice
              values:
                - Pessoa Física
                - Pessoa Jurídica
            docs_anexos:
              type: choice
              values:
                - Todos os documentos anexados ao chamado
                - Documentos pendentes de envio pelo cliente
            restricao:
              type: choice
              values:
                - Sem Restrição
                - Com Restrição
      - name: resultado
        type: shell
        params:
          shell: powershell
          cmd: |
            [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
            $canal = "{{formulario.canal}}"
            $contrato = "{{formulario.contrato}}"
            $tipoAtual = "{{formulario.tipo_atual}}"
            $nomeAtual = "{{formulario.nome_atual}}"
            $docAtual = "{{formulario.doc_atual}}"
            $tipoNovo = "{{formulario.tipo_novo}}"
            $nomeNovo = "{{formulario.nome_novo}}"
            $cpfNovo = "{{formulario.cpf_novo}}"
            $rgNovo = "{{formulario.rg_novo}}"
            $emailNovo = "{{formulario.email_novo}}"
            $telNovo = "{{formulario.tel_novo}}"
            $endNovo = "{{formulario.end_novo}}"
            $docsAnexos = "{{formulario.docs_anexos}}"
            $restricao = "{{formulario.restricao}}"

            if ($restricao -eq "Com Restrição") {
                $acao = "Restrição (protesto) encontrada no CPF/CNPJ do novo titular. Troca de titularidade negada e cliente informado da negativa."
            } else {
                $acao = "Sem restrições encontradas. Chamado encaminhado para a fila do Financeiro para cadastro no SAP e alteração contratual."
            }

            $msg = "Troca de Titularidade`n`nINFORMAÇÕES`n• Canal de Atendimento: $canal`n• Contrato: $contrato`n`nDADOS DO TITULAR ATUAL`n• Tipo de Perfil: $tipoAtual`n• Nome / Razão Social: $nomeAtual`n• CPF / CNPJ: $docAtual`n`nDADOS DO NOVO TITULAR`n• Tipo de Perfil: $tipoNovo`n• Nome / Razão Social: $nomeNovo`n• CPF / CNPJ: $cpfNovo`n• RG / Inscrição Estadual: $rgNovo`n• E-mail: $emailNovo`n• Telefone: $telNovo`n• Endereço: $endNovo`n`nVERIFICAÇÕES`n• Documentos Anexados: $docsAnexos`n• Análise de Restrição: $restricao`n`nSOLUÇÃO E ENCAMINHAMENTO`n• $acao"
            Write-Output $msg

  # /logtrocarestricao — Log interno de troca de titularidade negada por restrição (protesto) no CPF/CNPJ
  - trigger: "/logtrocarestricao"
    force_clipboard: true
