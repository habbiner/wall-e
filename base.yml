        params:
          layout: "Domínio: [[dominio]]"

  # /senhaemail — Informa que o suporte não possui acesso às senhas de contas de e-mail (Segurança)
  - trigger: "/senhaemail"
    force_clipboard: true
    replace: |-
      Compreendo a sua solicitação. No entanto, por políticas de privacidade e segurança da informação, a {{empresa_nome}} não possui acesso para visualizar ou recuperar senhas de contas de e-mail individuais criadas dentro da sua hospedagem.

      A gestão das caixas de e-mail é feita exclusivamente através do painel de controle (cPanel / Plesk). Apenas o responsável técnico da sua empresa que possui o acesso administrativo a esse painel consegue realizar a redefinição de uma nova senha para a sua conta.

      Recomendamos que entre em contato com o administrador da sua hospedagem ou com o setor de TI da sua empresa para que eles realizem a alteração, tudo bem?
    vars:
      - name: empresa_nome
        type: global

  # /senhacp — Orienta redefinição de senha de e-mail via cPanel (cliente)
  - trigger: "/senhacp"
    force_clipboard: true
    replace: |-
      Para redefinir a senha de uma conta de e-mail, siga os passos abaixo no cPanel:

      1. Acesse o painel de controle (cpanel.seudominio.com.br) com o usuário administrador.
      2. Vá em "Contas de E-mail" (Email Accounts).
      3. Localize a conta desejada e clique em "Gerenciar" (Manage).
      4. Em "Senha", defina uma nova senha forte (letras, números e símbolos).
      5. Salve e atualize a senha nos dispositivos (Outlook, celular etc.).

      ⚠️ A {{empresa_nome}} não possui acesso às senhas individuais das contas — apenas o administrador do cPanel consegue alterá-las.
    vars:
      - name: empresa_nome
        type: global

  # /popimap — Explica a diferença entre os protocolos POP e IMAP
  - trigger: "/popimap"
    force_clipboard: true
    replace: |-
      Compreendo a sua dúvida! A escolha entre os protocolos POP e IMAP define como o seu aplicativo de e-mail (Outlook, celular) vai interagir com as mensagens no nosso servidor. 

      Aqui está a diferença de forma direta:

      🌐 IMAP (Recomendado)
      • Sincroniza em tempo real com o servidor.
      • As mensagens permanecem salvas na nuvem e podem ser acessadas de vários aparelhos ao mesmo tempo (computador, celular e webmail).
      • Tudo o que você fizer (ler, apagar ou mover para pastas) em um dispositivo, refletirá automaticamente nos outros.

      💻 POP (POP3)
      • Faz o download (baixa) das mensagens para o seu aparelho e, por padrão, as apaga do nosso servidor.
      • Ideal se você precisa economizar espaço de armazenamento na sua hospedagem ou acessa o e-mail de um único computador fixo.
      • Não possui sincronização: se você baixar e ler os e-mails no computador, não conseguirá vê-los no celular depois.

      Se você precisa acessar a mesma conta em mais de um aparelho ou quer ter o backup no servidor, a recomendação técnica é utilizar o IMAP. 

      Qual você prefere utilizar para que eu possa te orientar com as portas corretas de configuração?

  # =============================================================================
  # 5 · Registros Internos — Financeiro
  # =============================================================================

  # /lognada — Log rápido: nenhuma ação no escopo do analista
  - trigger: "/lognada"
    replace: "Sem mais ações para o meu escopo neste atendimento."

  # /logacordo — Registra desbloqueio em acordo e assume chamado para acompanhamento
  - trigger: "/logacordo"
    force_clipboard: true
    replace: "{{resultado}}"
    vars:
      - name: data_2d_uteis
        type: global
      - name: formulario
        type: form
        params:
          layout: |
            Desbloqueio em Acordo
            Canal: [[canal]]
            Nome: [[nome]]
            Telefone: [[telefone]]
            Tipo de Serviço: [[tipo]]
          fields:
            canal: &canal_padrao
              - Blip
              - Ligação
              - E-mail
            tipo: &tipo_servico_padrao
              - Data Center (cPanel, Plesk, VPS)
              - Fibra Óptica
      - name: resultado
        type: shell
        params:
          shell: pwsh
          cmd: |
            [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
            $tipo = "{{formulario.tipo}}"
            $canal = "{{formulario.canal}}"
            $nome = "{{formulario.nome}}"
            $telefone = "{{formulario.telefone}}"
            $prazo = "{{data_2d_uteis}}"

            if ($tipo -match "Data Center") {
                $acao = "Desbloqueio do serviço realizado no servidor. O status no sistema de gestão permanece 'Bloqueado'."
            } else {
                $acao = "Desbloqueio em acordo executado via SAP/HANA."
            }

            $msg = "Desbloqueio em Acordo`n`nINFORMAÇÕES`n• Contato via: $canal`n• Solicitante: $nome — $telefone`n• Tipo de Serviço: $tipo`n`nPROCEDIMENTOS REALIZADOS`n• Ação: $acao`n• Prazo estendido até: $prazo.`n• Encaminhamento: Chamado assumido pelo próprio analista para acompanhamento da baixa bancária."
            Write-Output $msg

  # /logbaixa — Registra recebimento de comprovante e previsão de compensação D+1 útil
  - trigger: "/logbaixa"
    force_clipboard: true
    replace: "{{resultado}}"
    vars:
      - name: data_1d_util
        type: global
      - name: formulario
        type: form
        params:
          layout: |
            Comprovante de pagamento
            Canal: [[canal]]
            Nome: [[nome]]
            Telefone: [[telefone]]
            Tipo de Serviço: [[tipo]]
          fields:
            canal:
              type: choice
              values: *canal_padrao
            tipo:
              type: choice
              values: *tipo_servico_padrao
      - name: resultado
        type: shell
        params:
          shell: pwsh
          cmd: |
            [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
            $tipo = "{{formulario.tipo}}"
            $canal = "{{formulario.canal}}"
            $nome = "{{formulario.nome}}"
            $telefone = "{{formulario.telefone}}"
            $prazo = "{{data_1d_util}}"

            if ($tipo -match "Data Center") {
                $encaminhamento = "Chamado transferido para a fila do Financeiro para validação do comprovante e acompanhamento da baixa no sistema de gestão."
            } else {
                $encaminhamento = "Chamado mantido na fila aguardando a compensação bancária automática via SAP/HANA."
            }

