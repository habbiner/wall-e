                - Plesk
      - name: resultado
        type: shell
        params:
          shell: powershell
          cmd: |
            [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
            $plat = "{{formulario.plataforma}}"
            $dom = "{{formulario.dominio}}"
            $ip = "{{formulario.ip}}"
            $userCp = "{{formulario.user_cpanel}}"
            $senhaCp = "{{formulario.senha_cpanel}}"
            $userPl = "{{formulario.user_plesk}}"
            $senhaPl = "{{formulario.senha_plesk}}"
            $saudacao = "{{saudacao}}"

            $msg = "Olá, ${saudacao}! Tudo bem? 😊`n`nSeguem os dados de acesso ao painel de controle da hospedagem do domínio ${dom}:`n"

            if ($plat -eq "cPanel") {
