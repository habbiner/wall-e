            Documentos: [[documentos]]
          fields:
            tipo_titular:
              type: choice
              values:
                - novo titular
                - titular atual
            documentos:
              type: choice
              values:
                - "• Documento com foto (RG ou CNH)\n• CPF\n• Data de nascimento\n• E-mail\n• Endereço completo"
                - "• Cartão CNPJ\n• Razão social\n• Comprovante de inscrição e situação cadastral\n• E-mail\n• Endereço completo"

  # /fid — Calcula e explica a multa de fidelidade automaticamente (Regra BDC)
  # Uso: /fid [meses ativos] — Exemplo: /fid 5 (para um cliente com 5 meses de uso)
  - regex: "/fid (?P<meses>[0-9]{1,2})"
    force_clipboard: true
    replace: "{{resultado}}"
    vars:
      - name: valor_mensalidade_fid
        type: global
      - name: resultado
        type: shell
        params:
          shell: pwsh
          cmd: |
            [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
            $OutputEncoding = [System.Text.Encoding]::UTF8
            $mesesUsados = [int]"{{meses}}"

            if ($mesesUsados -ge 12) {
                Write-Output "Verifiquei em nosso sistema e o seu contrato foi ativado há $mesesUsados meses.`n`nComo o período obrigatório de 12 meses já foi concluído, você está isento da multa de fidelidade. Podemos prosseguir com o cancelamento sem custos rescisórios."
                exit
            }

            $mesesRestantes = 12 - $mesesUsados

            # Tratamento seguro para converter o valor global (com ponto ou vírgula) para decimal
            $mensalidadeStr = "{{valor_mensalidade_fid}}".Replace(",", ".")
            $mensalidade = [convert]::ToDouble($mensalidadeStr, [System.Globalization.CultureInfo]::InvariantCulture)

            $multa = ($mensalidade / 12) * $mesesRestantes

            # Força a formatação da moeda para o padrão brasileiro (vírgula para decimais)
            $cultura = [System.Globalization.CultureInfo]::GetCultureInfo("pt-BR")
            $multaFormatada = $multa.ToString("N2", $cultura)

            $mensagem = "Verifiquei em nosso sistema e o seu contrato foi ativado há $mesesUsados meses.`n`nNossos contratos de prestação de serviço possuem uma cláusula de fidelização padrão de 12 meses. Como o cancelamento está sendo solicitado antes deste período, haverá a cobrança proporcional da multa por quebra de contrato.`n`nO valor atualizado da multa rescisória é de R$ $multaFormatada. Você está de acordo com esta cobrança para prosseguirmos com o cancelamento?"

            Write-Output $mensagem

