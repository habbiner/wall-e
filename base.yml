# =============================================================================
# BASE.YML — Espanso · Atendimento COM4
# Organizado por contexto · Saudação dinâmica
#
# ÍNDICE DE TRIGGERS
#
# 1 · Saudação, Identificação e Encerramento
#   /ola              Saudação inicial com horário dinâmico e coleta de dados obrigatórios
#   /proto            Envia o número do protocolo ao cliente
#   /retorno          Script de retorno ativo para chamados em aberto (chat ou ligação)
#   /retornocom       Retorno ativo de chamado repassado pelo Comercial
#   /atraso           Pede desculpas por fila alta no plantão
#   /espera           Solicita pausa breve para consultar o sistema (obrigatório monitoria)
#   /analise          Informa pausa longa para análise técnica aprofundada nos logs
#   /obg              Agradece ao cliente após retorno de pausa (obrigatório monitoria)
#   /transfere        Informa ao cliente a transferência para outro setor
#   /prazo            Informa SLA de retorno
#   /aux              Pergunta se precisa de mais alguma ajuda antes de encerrar
#   /alerta           Avisa sobre inatividade e encerramento automático em 30 min
#   /final            Encerra o atendimento por inatividade com pedido de avaliação
#   /lognada          Log rápido: nenhuma ação no escopo do analista
#   /logenc           Log rápido: encerramento simples do chamado
#   /confirmo         Confirma entendimento do cliente antes de prosseguir
#   /dados            Re-solicita dados cadastrais incompletos ou divergentes
#   /aguarda          Informa que permanece aguardando retorno do cliente (monitoria)
#   /horario          Informa horário comercial de atendimento presencial e telefônico
#   /avalie           Solicita avaliação no Google (chat/Blip)
#   /avaliemail       Bloco de avaliação Google para e-mails
#   /tchau            Encerramento de chat com o pedido de avaliação do Google embutido
#
# 2 · Financeiro — Cliente
#   /bloqueado        Informa suspensão por fatura em aberto; oferece 2ª via ou aguarda comprovante
#   /seg              Envia 2ª via do boleto com data de vencimento
#   /agendamento      Informa que o documento enviado é comprovante de agendamento, não pagamento
#   /pix              Envia chave PIX e linha digitável do boleto
#   /pixrapido        Envia PIX (chave do .env) + linha digitável — só pede o boleto
#   /ofer             Oferece o desbloqueio em acordo (antes de executar); informa prazo D+2
#   /acordo           Confirma que o desbloqueio em acordo foi realizado + prazo D+2
#   /norm             Confirma desbloqueio concluído após baixa bancária confirmada
#   /comp             Confirma recebimento e registro do comprovante de pagamento
#   /emailcomp        Confirmação formal de recebimento de comprovante via e-mail
#   /faltadados       Solicita CPF/CNPJ de comprovante recebido sem identificação via e-mail
#   /boletoinvertido  Cliente pagou boleto do mês posterior em vez do vigente
#   /venc       Resposta ao cliente sobre alteração de vencimento
#   /protesto         Explica o processo e encaminha título protestado ao Financeiro
#   /comodato         Informa regras de devolução do equipamento e multa por extravio
#   /doctroca         Solicita documentos (PF ou PJ) para iniciar troca de titularidade
#   /fidelidade       Explica cláusula de fidelidade e valor da multa rescisória
#   /retirada         Agenda recolha do modem após cancelamento
#   /faturacanc       Informa valor proporcional da última fatura durante cancelamento
#   /lembretefatura   Lembrete proativo de fatura em aberto antes do bloqueio ocorrer
#   /negado           Informa que o comprovante está ilegível ou incompleto
#   /duplicata        Informa que o comprovante já consta registrado no sistema
#   /desbloqprazo     Informa prazo de desbloqueio após compensação bancária (D+1)
#   /correios         Explica atraso na fatura impressa e reforça canais digitais
#   /cancelapf        Informa prazo de 1 dia útil do Financeiro para cancelamento PF
#   /cancelapj        Solicita formalização por e-mail para cancelamento PJ
#
# 3 · Suporte Técnico — Cliente
#   /fibra            Orienta verificação visual do cabo de fibra e do conector
#   /fotos            Solicita fotos do equipamento (painel de luzes e cabeamento)
#   /los             Explica luz LOS (vermelha) e abre chamado para equipe de campo
#   /massivo          Informa ao cliente que há uma ocorrência massiva em andamento na região
#   /massivoresolvido Notifica o cliente que a falha massiva foi resolvida pela equipe de campo
#   /romp             Informa rompimento grave de fibra óptica na região (acidente/evento externo)
#   /clima            Informa interrupção causada por condições climáticas severas na área
#   /online           Confirma que o monitoramento detectou o sinal restaurado; pede teste
#   /reinicia         Orienta reinício do modem/roteador (1 minuto na tomada)
#   /wifi             Diagnóstico de instabilidade: isola problemas no Wi-Fi vs. fibra
#   /speedwifi        Explica a limitação de velocidade via Wi-Fi e pede teste via cabo (Proposto)
#   /rotoff           Modem OK, mas roteador do cliente desligado ou desconectado
#   /instab           Questionário de diagnóstico de instabilidade (lentidão, queda, falha específica)
#   /reset            Confirma sinal normal e propõe reconfiguração lógica remota do modem
#   /fast             Explica limitação do roteador Fast (100Mbps) e sugere troca por Gigabit
#   /roteadores       Envia o PDF de recomendação de roteadores Giga e reforça a visita gratuita
#   /visita           Coleta endereço e disponibilidade para agendar visita técnica presencial
#   /bridge           Explica modo bridge e uso de roteador próprio com PPPoE
#   /pppoe            Envia credenciais PPPoE para configuração de roteador próprio
#   /speedtest        Orienta teste de velocidade via cabo de rede
#   /iptv             Explica instabilidade em TV Box/IPTV por bloqueios da Anatel
#   /eng              Informa escalonamento do chamado para a Engenharia (Nível 2)
#   /domcong          Explica bloqueio por domínio congelado no Registro.br
#   /pmg              Explica o painel PMG de quarentena antispam e as ações disponíveis
#   /cpanel           Solicita e-mail corporativo formal para envio seguro de credenciais cPanel
#   /ssl              Informa sobre propagação normal do certificado SSL recém-instalado
#   /escopo           Delimita o escopo da Com4: infra e rede, não sistemas de terceiros
#   /recursos         Alerta sobre limite de CPU/RAM no plano compartilhado e sugere VPS
#   /spamout          Trata conta de e-mail bloqueada por disparo de spam (conta comprometida)
#   /dnsprop          Explica propagação DNS ao cliente (2 a 24 horas)
#   /viabilidade      Informa cliente (Lead) que há viabilidade de fibra no endereço (Padrão BDC)
#   /semviabilidade   Informa cliente (Lead) sobre falta de viabilidade de fibra no endereço (Padrão BDC)
#
# 4 · E-mail, Hospedagem e Migração
#   /ativhosp         Envia dados de acesso ao cPanel, FTP, Webmail e DNS (ativação de hospedagem)
#   /dadospainel      Envia URLs e senhas dos painéis cPanel e/ou Plesk
#   /ativemail        Envia dados de acesso e portas de configuração da conta de e-mail Com4
#   /migraaponta      Avisa sobre migração de servidor e solicita atualização dos apontamentos DNS externos
#   /migracontato     Propõe migração de hospedagem e solicita adição como contato técnico no Registro.br
#   /renova           Envia boleto para renovação de registro de domínio
#   /dnsemail         Envia todos os apontamentos DNS necessários para e-mail com site em provedor externo
#   /autormigra       Solicita autorização formal do cliente para executar a migração de hospedagem
#   /ftp              Envia host, usuário e porta 21 para conexão via FileZilla (FTP)
#   /propag           Avisa sobre propagação DNS após migração ou alteração de apontamentos
#   /senhaemail       Informa que suporte não acessa senhas de e-mail (segurança)
#   /senhacp          Orienta redefinição de senha de e-mail via cPanel (cliente)
#
# 5 · Registros Internos — Financeiro
#   /logacordo        Registra desbloqueio em acordo com canal, solicitante e prazo D+2 úteis
#   /logbaixa         Registra recebimento de comprovante e previsão de compensação D+1 útil
#   /logpagou         Registra pagamento compensado e confirmado no sistema
#   /logcalote        Registra retomada da suspensão por falta de pagamento pós-acordo
#   /log2via          Log completo de atendimento de emissão de 2ª via de boleto
#   /logvenc          Log de solicitação de alteração da data de vencimento mensal
#   /loginvertido     Log interno de pagamento de fatura do mês incorreto
#   /logcanc          Log de repasse de cancelamento para o Financeiro (Novo Fluxo)
#   /logprotesto      Log de encaminhamento de título protestado ao Financeiro (carta de anuência)
#   /loglead          Log de oportunidade comercial identificada; encaminha lead ao Comercial
#   /logcorreios      Log de orientação sobre atraso de fatura impressa (Correios)
#
# 6 · Registros Internos — NOC / Técnico
#   /logcong          Log de domínio congelado no Registro.br com renovação e período
#   /logfalha         Log de falha de acesso aos serviços Com4 com testes de DNS e Imunify360
#   /loglos           Log de abertura de visita técnica de fibra (LOS ou atenuação)
#   /logmassivo       Log de cliente atendido durante ocorrência massiva em área
#   /logsemretorno    Log de tentativa de retorno telefônico sem resposta do cliente
#   /logvps           Log de suporte a servidor VPS com testes, acesso e autorização de reinício
#   /logsite          Log de suporte a site com diagnóstico de DNS, disco e banco de dados
#   /logemail         Log de suporte a e-mail com testes de webmail, DNS e configuração IMAP/POP
#   /logtroca         Log de troca de titularidade com dados do titular atual e do novo
#   /loginstruir      Log detalhado de orientação sobre o Gateway Antispam PMG
#   /logpmgoff        Log de desativação do filtro antispam PMG para um domínio
#   /logpmgon         Log de reativação do filtro antispam PMG para um domínio
#   /logtimeout       Log de encerramento automático por timeout (inatividade no Blip)
#   /logbloq          Log de bloqueio automático ou manual de conta no servidor (cPanel/Plesk/VPS)
#   /logdesbloq       Log de desbloqueio manual de conta após regularização
#   /logfin           Log de bloqueio não efetuado; escala para o Financeiro para validação
#   /logmudanca       Log de mudança de endereço; encaminha para fila de Ativação da Fibra
#   /logozmap         Log de análise de viabilidade técnica com coordenadas e CTO no Ozmap
#   /logromp          Log padronizado de atendimento de cliente afetado por rompimento de fibra
#   /logfimromp       Log de encerramento de chamado após reparo do rompimento concluído
#   /loginviavel      Log de inviabilidade técnica; encaminha estudo de expansão para Projetos
#   /logreinicia      Log de reinício remoto de servidor ou serviço solicitado pelo cliente
#   /logfast          Log de diagnóstico de roteador Fast (100Mbps) com orientação de troca
#   /logvisitarot     Log de abertura de visita técnica para configuração de novo roteador
#   /logpppoe         Log de envio de credenciais PPPoE ao cliente
#   /logreset         Log de reconfiguração lógica / reset remoto da ONU
#   /logiptv          Log de diagnóstico de instabilidade em TV Box/IPTV
#   /logrotoff        Log de roteador do cliente desligado/desconectado
#   /logsenha         Log de visita técnica para alteração de senha/nome Wi-Fi
#   /logonline        Log de confirmação de sinal restaurado após reparo
#
# =============================================================================

# -----------------------------------------------------------------------------
# VARIÁVEIS GLOBAIS — carregadas de match.env
# -----------------------------------------------------------------------------
global_vars:
  - name: atendente_nome
    type: shell
    params:
      shell: powershell
      cmd: |
        $p = Join-Path $env:CONFIG 'match\.env'
        if (Test-Path $p) {
          $l = Get-Content $p | Where-Object { $_ -match '^\s*ATENDENTE_NOME\s*=' } | Select-Object -First 1
          if ($l) { (($l -split '=', 2)[1]).Trim().Trim('"').Trim("'") } else { 'Bruno' }
        } else { 'Bruno' }

  - name: empresa_nome
    type: shell
    params:
      shell: powershell
      cmd: |
        $p = Join-Path $env:CONFIG 'match\.env'
        if (Test-Path $p) {
          $l = Get-Content $p | Where-Object { $_ -match '^\s*EMPRESA_NOME\s*=' } | Select-Object -First 1
          if ($l) { (($l -split '=', 2)[1]).Trim().Trim('"').Trim("'") } else { 'COM4' }
        } else { 'COM4' }

  - name: email_atendimento
    type: shell
    params:
      shell: powershell
      cmd: |
        $p = Join-Path $env:CONFIG 'match\.env'
        if (Test-Path $p) {
          $l = Get-Content $p | Where-Object { $_ -match '^\s*EMAIL_ATENDIMENTO\s*=' } | Select-Object -First 1
          if ($l) { (($l -split '=', 2)[1]).Trim().Trim('"').Trim("'") } else { 'atendimento@com4.com.br' }
        } else { 'atendimento@com4.com.br' }

  - name: chave_pix
    type: shell
    params:
      shell: powershell
      cmd: |
        $p = Join-Path $env:CONFIG 'match\.env'
        if (Test-Path $p) {
          $l = Get-Content $p | Where-Object { $_ -match '^\s*CHAVE_PIX\s*=' } | Select-Object -First 1
          if ($l) { (($l -split '=', 2)[1]).Trim().Trim('"').Trim("'") } else { '' }
        } else { '' }

  - name: contato_registro_br
    type: shell
    params:
      shell: powershell
      cmd: |
        $p = Join-Path $env:CONFIG 'match\.env'
        if (Test-Path $p) {
          $l = Get-Content $p | Where-Object { $_ -match '^\s*CONTATO_REGISTRO_BR\s*=' } | Select-Object -First 1
          if ($l) { (($l -split '=', 2)[1]).Trim().Trim('"').Trim("'") } else { 'PHF5' }
        } else { 'PHF5' }

  # Saudação minúscula — uso após "Olá, {{saudacao}}!"
  - name: saudacao
    type: shell
    params:
      shell: powershell
      cmd: "$h = (Get-Date).Hour; if ($h -lt 12) { 'bom dia' } elseif ($h -lt 18) { 'boa tarde' } else { 'boa noite' }"

  # Saudação capitalizada — uso no início de frase: "{{saudacao_cap}}! Aqui é..."
  - name: saudacao_cap
    type: shell
    params:
      shell: powershell
      cmd: "$h = (Get-Date).Hour; if ($h -lt 12) { 'Bom dia' } elseif ($h -lt 18) { 'Boa tarde' } else { 'Boa noite' }"

  # Despedida dinâmica — uso em /tchau (inline, sem .ps1 — evita ExecutionPolicy)
  - name: despedida
    type: shell
    params:
      shell: powershell
      cmd: |
        [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
        $p = Join-Path $env:CONFIG 'match\.env'
        $h = (Get-Date).Hour
        if ($h -lt 12) { $key = 'DESPEDIDA_MANHA'; $fb = 'Tenha um ótimo dia' } elseif ($h -lt 18) { $key = 'DESPEDIDA_TARDE'; $fb = 'Tenha uma ótima tarde' } else { $key = 'DESPEDIDA_NOITE'; $fb = 'Tenha uma ótima noite' }
        if (Test-Path $p) {
          $l = Get-Content $p -Encoding UTF8 | Where-Object { $_ -match ('^\s*' + $key + '\s*=') } | Select-Object -First 1
          if ($l) { (($l -split '=', 2)[1]).Trim().Trim('"').Trim([char]39) } else { $fb }
        } else { $fb }

  - name: data_hoje
    type: shell
    params:
      shell: powershell
      cmd: "(Get-Date).ToString('dd/MM/yyyy')"

  - name: hora_atual
    type: shell
    params:
      shell: powershell
      cmd: "(Get-Date).ToString('HH:mm')"

  - name: data_2d_uteis
    type: shell
    params:
      shell: powershell
      cmd: "$d = Get-Date; $c = 2; while($c -gt 0){ $d = $d.AddDays(1); if($d.DayOfWeek -ne 'Saturday' -and $d.DayOfWeek -ne 'Sunday'){ $c-- } }; $d.ToString('dd/MM/yyyy')"

  - name: data_1d_util
    type: shell
    params:
      shell: powershell
      cmd: "$d = Get-Date; $c = 1; while($c -gt 0){ $d = $d.AddDays(1); if($d.DayOfWeek -ne 'Saturday' -and $d.DayOfWeek -ne 'Sunday'){ $c-- } }; $d.ToString('dd/MM/yyyy')"

matches:

# =============================================================================
# 1 · Saudação, Identificação e Encerramento
# =============================================================================

  # /ola — Saudação inicial com horário dinâmico e coleta de dados obrigatórios
  - trigger: "/ola"
    force_clipboard: true
    replace: |-
      Olá, {{saudacao}}! Tudo bem? 😊

      Sou o {{atendente_nome}} e darei sequência ao seu atendimento.

      Para continuarmos, confirme, por gentileza, os seguintes dados:

      Seu Nome Completo:
      CPF ou CNPJ:
      Telefone:
      E-mail:
    vars:
      - name: atendente_nome
        type: global
      - name: saudacao
        type: global

  # /proto — Envia o número do protocolo ao cliente
  - trigger: "/proto"
    force_clipboard: true
    replace: |-
      O número do protocolo referente a este atendimento é: {{formulario.protocolo}}

      Data: {{data_hoje}}
    vars:
      - name: data_hoje
        type: global
      - name: formulario
        type: form
        params:
          layout: "Protocolo: [[protocolo]]"

  # /retorno — Script de retorno ativo para chamados em aberto (chat ou ligação)
  - trigger: "/retorno"
    force_clipboard: true
    replace: |-
      {{saudacao_cap}}! Aqui é o {{atendente_nome}}, do suporte da {{empresa_nome}}. Estou retornando o contato referente ao chamado em aberto. Podemos prosseguir?
    vars:
      - name: atendente_nome
        type: global
      - name: empresa_nome
        type: global
      - name: saudacao_cap
        type: global

  # /retornocom — Retorno ativo de chamado repassado pelo Comercial
  - trigger: "/retornocom"
    force_clipboard: true
    replace: |-
      Olá, {{saudacao}}! Aqui é o {{atendente_nome}}, do suporte técnico da {{empresa_nome}}.
      
      Recebemos o seu chamado por meio do nosso setor Comercial referente aos seus serviços.
      Para que eu possa iniciar o diagnóstico de forma precisa, por gentileza, detalhe o que está ocorrendo no momento.
      
      Você está próximo ao equipamento para realizarmos os testes?
    vars:
      - name: atendente_nome
        type: global
      - name: empresa_nome
        type: global
      - name: saudacao
        type: global

  # /atraso — Pede desculpas por fila alta no plantão
  - trigger: "/atraso"
    force_clipboard: true
    replace: |-
      Olá, {{saudacao}}! Peço sinceras desculpas pelo tempo de espera em nosso retorno. 
      
      Estamos operando com um volume de chamados excepcionalmente alto no plantão de hoje, o que acabou gerando fila e impactando o nosso tempo de resposta.
    vars:
      - name: saudacao
        type: global

  # /espera — Solicita pausa breve para consultar o sistema (obrigatório monitoria)
  - trigger: "/espera"
    replace: "Só um momento, por gentileza, enquanto verifico as informações. ⏱️"

  # /analise — Informa pausa longa para análise técnica aprofundada nos logs
  - trigger: "/analise"
    replace: "Vou precisar realizar uma análise mais detalhada nos logs do servidor para identificar a causa raiz. Isso pode levar alguns minutos. Assim que eu tiver o diagnóstico, retorno aqui, combinado? ⏱️"

  # /obg — Agradece ao cliente após retorno de pausa (obrigatório monitoria)
  - trigger: "/obg"
    replace: "Obrigado por aguardar! Peço desculpas pela demora. 😊"

  # /transfere — Informa ao cliente a transferência para outro setor
  - trigger: "/transfere"
    force_clipboard: true
    replace: |-
      Vou encaminhar o seu atendimento para o setor de {{formulario.setor}}, que dará continuidade à sua solicitação.

      Peço que aguarde um momento, por gentileza.
    vars:
      - name: formulario
        type: form
        params:
          layout: "Setor de destino: [[setor]]"
          fields:
            setor:
              type: choice
              values:
                - Financeiro
                - Comercial
                - Engenharia (Nível 2)
                - Ativação da Fibra
                - Projetos / Expansão

  # /prazo — Informa SLA de retorno
  - trigger: "/prazo"
    form: |
      A sua solicitação foi registrada com sucesso. O nosso prazo de retorno para este tipo de atendimento é de até [[horas]] horas úteis.
      
      Assim que tivermos uma atualização, entraremos em contato por aqui.
    form_fields:
      horas:
        type: choice
        values:
          - "4"
          - "8"
          - "24"
          - "48"
          - "72"

  # /aux — Pergunta se precisa de mais alguma ajuda antes de encerrar
  - trigger: "/aux"
    replace: "Posso ajudar em algo mais? 😊"

  # /alerta — Avisa sobre inatividade e encerramento automático em 30 min
  - trigger: "/alerta"
    force_clipboard: true
    replace: |-
      Olá! 😊

      Você ainda precisa da nossa ajuda?

      Estamos há algum tempo sem o seu retorno; por isso, este atendimento será encerrado automaticamente em 30 minutos.

      Quando precisar, é só responder por aqui!

  # /final — Encerra o atendimento por inatividade com pedido de avaliação
  - trigger: "/final"
    force_clipboard: true
    replace: |-
      Como não recebemos mais retorno, encerro este atendimento por inatividade.

      Se precisar de ajuda novamente, fale com a gente por aqui. Estamos à disposição! 🤝
      
      Seu feedback é importante para a Com4 Data Center. Poste uma avaliação no nosso perfil do Google:
      👉 https://g.page/r/CdBIvBOvM7UBEAE/review

  # /lognada — Log rápido: nenhuma ação no escopo do analista
  - trigger: "/lognada"
    replace: "Sem mais ações para o meu escopo neste atendimento."

  # /logenc — Log rápido: encerramento simples do chamado
  - trigger: "/logenc"
    replace: "Chamado encerrado."

  # /confirmo — Confirma entendimento do cliente antes de prosseguir
  - trigger: "/confirmo"
    replace: "Perfeito! Só para confirmar: entendi corretamente a sua solicitação. Vou dar sequência conforme combinado. 😊"

  # /dados — Re-solicita dados cadastrais incompletos ou divergentes
  - trigger: "/dados"
    force_clipboard: true
    replace: |-
      Para darmos continuidade com segurança, preciso confirmar alguns dados do cadastro:

      Nome completo:
      CPF ou CNPJ:
      Telefone de contato:
      E-mail:

      Pode me enviar, por gentileza?

  # /aguarda — Informa que permanece aguardando retorno do cliente (monitoria)
  - trigger: "/aguarda"
    replace: "Permaneço no aguardo do seu retorno. 😊"

  # /horario — Informa horário comercial de atendimento presencial e telefônico
  - trigger: "/horario"
    force_clipboard: true
    replace: |-
      Nosso horário de atendimento comercial é:

      • Segunda a sexta-feira: das 08:00 às 18:00
      • Sábados: das 08:00 às 12:00
      • Domingos e feriados: plantão técnico conforme escala (suporte remoto)

      Visitas técnicas presenciais são agendadas dentro deste horário, com confirmação prévia por este canal.

  # /avalie — Solicita avaliação no Google de forma isolada (Chat/Blip)
  - trigger: "/avalie"
    force_clipboard: true
    replace: |-
      Fico feliz que conseguimos resolver a sua solicitação! 😊
      
