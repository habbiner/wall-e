  # /titularidade — Solicita documentos do NOVO titular (PF ou PJ) para iniciar troca de titularidade
  - trigger: "/titularidade"
    force_clipboard: true
    replace: "{{resultado}}"
    vars:
      - name: formulario
        type: form
        params:
          layout: "Perfil do novo titular: [[perfil]]"
          fields:
            perfil:
              type: choice
              values:
                - Pessoa Física
                - Pessoa Jurídica
      - name: resultado
        type: shell
        params:
          shell: powershell
          cmd: |
            [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
            $perfil = "{{formulario.perfil}}"

            if ($perfil -eq "Pessoa Física") {
                $docs = "• Documento com foto (RG ou CNH)`n• CPF`n• Data de nascimento`n• E-mail`n• Endereço completo"
            } else {
                $docs = "• Cartão CNPJ`n• Razão Social`n• Comprovante de Inscrição e Situação Cadastral`n• E-mail`n• Endereço completo"
            }

            $msg = "Para seguirmos com a troca de titularidade, preciso dos dados e documentos do novo titular:`n`n$docs`n`nVocê pode mandar as fotos ou os arquivos em PDF por aqui mesmo."
            Write-Output $msg

# /trocarestricao — Informa negativa de troca de titularidade devido a protesto no CPF/CNPJ do novo titular
  - trigger: "/trocarestricao"
    force_clipboard: true
    replace: |-
      Analisamos os dados que você nos enviou para a troca de titularidade.

      O documento (CPF/CNPJ) do novo titular tem uma restrição ativa (protesto). Pelos nossos procedimentos internos, não conseguimos aprovar a transferência do contrato enquanto essa pendência estiver em aberto no nome do novo responsável.

  # /fid — Calcula e explica a multa de fidelidade automaticamente (Regra BDC)
  # Uso: /fid [meses ativos] — Exemplo: /fid 5 (para um cliente com 5 meses de uso)
  - regex: "/fid (?P<meses>[0-9]{1,2})"
    force_clipboard: true
    replace: "{{resultado}}"
    vars:
      - name: valor_mensalidade_fid
        type: global
      - name: resultado
        type: shell
        params:
          shell: powershell
          cmd: |
            [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
            $OutputEncoding = [System.Text.Encoding]::UTF8
            $mesesUsados = [int]"{{meses}}"

            if ($mesesUsados -ge 12) {
                Write-Output "Verifiquei aqui: o seu contrato está ativo há $mesesUsados meses.`n`nComo a fidelidade de 12 meses já foi cumprida, não há multa a pagar. Podemos seguir com o cancelamento sem custo rescisório."
                exit
            }

            $mesesRestantes = 12 - $mesesUsados

            # Tratamento seguro para converter o valor global (com ponto ou vírgula) para decimal
            $mensalidadeStr = "{{valor_mensalidade_fid}}".Replace(",", ".")
            $mensalidade = [convert]::ToDouble($mensalidadeStr, [System.Globalization.CultureInfo]::InvariantCulture)

            $multa = ($mensalidade / 12) * $mesesRestantes

            # Força a formatação da moeda para o padrão brasileiro (vírgula para decimais)
            $cultura = [System.Globalization.CultureInfo]::GetCultureInfo("pt-BR")
            $multaFormatada = $multa.ToString("N2", $cultura)

            $mensagem = "Verifiquei aqui: o seu contrato está ativo há $mesesUsados meses.`n`nOs nossos contratos têm fidelidade de 12 meses. Como o cancelamento está sendo pedido antes desse prazo, há cobrança proporcional aos $mesesRestantes meses restantes.`n`nO valor da multa fica em R$ $multaFormatada. Você concorda com essa cobrança para eu seguir com o cancelamento?"

            Write-Output $mensagem

