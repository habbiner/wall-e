    force_clipboard: true
    replace: |-
      Sobre o título protestado: o nosso setor Financeiro precisa levantar as custas do cartório e emitir um boleto atualizado com esses valores.

      Vou encaminhar o seu caso para lá agora. A equipe faz a emissão e envia o boleto para você por aqui mesmo.

      Só um momento, por favor!

  # /invertido — Avisa o cliente sobre o pagamento invertido e o prazo de desbloqueio
  - trigger: "/invertido"
    force_clipboard: true
    replace: |-
      Identifiquei aqui que o pagamento foi feito na fatura do próximo mês (vencimento em {{formulario.vencimento_pago}}), e não na que estava pendente (vencimento em {{formulario.vencimento_atual}}).

      Para você não ficar sem conexão por causa dessa inversão, já fiz o desbloqueio manual dos serviços, em caráter excepcional.

      O acesso fica liberado até o dia {{formulario.vencimento_pago}}. Se a fatura pendente ({{formulario.vencimento_atual}}) não for regularizada até essa data, o sistema aplica um novo bloqueio automático.

      Quer que eu te envie a 2ª via atualizada da fatura pendente agora, para facilitar?
    vars:
      - name: formulario
        type: form
        params:
          layout: |
            Pagamento Invertido
            Vencimento pago (errado): [[vencimento_pago]]
            Vencimento pendente (atual): [[vencimento_atual]]

  # =============================================================================
  # 3 · Suporte Técnico — Cliente
  # =============================================================================

  # /fibra — Orienta verificação visual do cabo de fibra e do conector
  - trigger: "/fibra"
    force_clipboard: true
    replace: |-
      Verifique, por favor, se o cabo de fibra óptica está bem encaixado no equipamento.

      Não precisa retirar nem limpar o conector: ele é bem sensível, então só confira se está firme na porta.

      Dê uma olhada no cabo pela parte visível, sem forçá-lo. Dobras marcadas, torções ou rupturas podem indicar um problema físico na conexão.

      Essas informações ajudam bastante na análise. ✅

  # /fotos — Solicita evidências visuais do equipamento (painel de luzes e cabeamento)
  - trigger: "/fotos"
    force_clipboard: true
    replace: |-
      Você pode me enviar algumas fotos dos equipamentos aí no local? Isso ajuda bastante na análise do status físico da sua conexão. 📸

      Tente capturar:
      1. A parte frontal do modem da {{empresa_nome}}, mostrando quais luzes estão acesas, apagadas ou piscando.
      2. A parte traseira, mostrando como os cabos estão conectados.

      Com essas fotos, consigo identificar falhas de cabeamento, travamentos ou perda de sinal bem mais rápido.
    vars:
      - name: empresa_nome
        type: global

  # /los — Explica luz LOS (vermelha) e abre chamado para equipe de campo
  - trigger: "/los"
    force_clipboard: true
    replace: |-
      A luz vermelha no seu modem {{empresa_nome}} (modelo branco com o logo da {{empresa_nome}}) indica perda de sinal, chamada de LOS: há uma interrupção no trecho de fibra entre o seu equipamento e a nossa rede.

      Vou registrar o seu caso com a equipe de manutenção de fibra para restabelecerem a conexão o quanto antes.
    vars:
      - name: empresa_nome
        type: global

  # /testelink — Informa verificações remotas e necessidade de teste de link presencial
  - trigger: "/testelink"
    force_clipboard: true
    replace: |-
      Analisei os parâmetros da sua conexão no nosso sistema de monitoramento: sinal óptico, histórico de estabilidade e comportamento do equipamento até agora.

      As verificações remotas não foram suficientes para identificar a causa exata dessa ocorrência, então vou enviar um técnico até o local para um teste de link presencial (aferição direta de sinal na ONU e no cabeamento de fibra).

  # /romp — Informa rompimento grave de fibra óptica na região (acidente/evento externo)
  - trigger: "/romp"
    force_clipboard: true
    form: |
      Pedimos desculpas pela interrupção dos serviços de internet hoje.

      Ela foi causada por um rompimento de fibra óptica de grande proporção, que atingiu a infraestrutura de rede na região. Como é um incidente em larga escala, outras operadoras também foram afetadas e estão com interrupções nos seus serviços.

      As equipes responsáveis já estão trabalhando nos reparos para restabelecer a conectividade o mais rápido possível. A previsão atual para normalizar os serviços é entre [[previsao]].

      Lamentamos o transtorno e agradecemos a paciência. Vamos acompanhar a situação e avisar sobre qualquer atualização relevante.

  # /resolvido — Notifica o cliente que a falha massiva foi resolvida pela equipe de campo
  - trigger: "/resolvido"
    force_clipboard: true
    replace: |-
      Olá! A intervenção técnica que afetava os serviços na sua região foi concluída pela nossa equipe de Manutenção de Fibra.

      A sua conexão já foi restabelecida. Por precaução, recomendamos desligar o modem da tomada por 1 minuto e ligar novamente.

      Confirma para mim se o acesso normalizou?

  # /clima — Informa interrupção causada por condições climáticas severas na área
  - trigger: "/clima"
    force_clipboard: true
    replace: |-
      As fortes chuvas e as condições climáticas na sua região afetaram o fornecimento de energia ou a infraestrutura externa da nossa rede de fibra.

      As nossas equipes de campo já estão a caminho para restabelecer os serviços assim que as condições de segurança permitirem.

      Pedimos desculpas pelo transtorno e agradecemos a compreensão!

  # /online — Confirma que o monitoramento detectou o sinal restaurado; pede teste
  - trigger: "/online"
    force_clipboard: true
    replace: |-
      O nosso monitoramento mostra que o sinal da sua conexão já foi restabelecido depois dos reparos.

      Pode testar a navegação para confirmarmos se o serviço normalizou? Se o acesso ainda não voltou, tente reiniciar o equipamento (tirar o modem/roteador da tomada por 1 minuto e ligar de novo).

      Fico no aguardo!

  # /speedwifi — Explica a limitação de velocidade via Wi-Fi e pede teste via cabo (Proposto)
  - trigger: "/speedwifi"
    force_clipboard: true
    replace: |-
      Notei que o teste de velocidade foi feito pelo Wi-Fi.

      O sinal sem fio perde pacotes naturalmente e sofre interferência do ambiente (paredes, espelhos, outros eletrônicos), então não transmite a velocidade total da fibra.

      Para vermos a capacidade real que chega até você, o ideal é testar com um computador ligado direto no modem por cabo de rede. Consegue fazer esse teste e nos enviar o resultado?

  # /rotoff — Informa que o modem Com4 está normal, mas o roteador do cliente está desligado/desconectado
  - trigger: "/rotoff"
    force_clipboard: true
    replace: |-
      Analisei a sua conexão: o sinal da fibra e o modem da Com4 estão funcionando bem, e a internet está chegando normalmente até o local.

      O que o nosso sistema não está detectando é o seu roteador particular (o que emite o Wi-Fi). Isso indica que ele pode estar desligado da tomada, ou que o cabo entre o modem da Com4 e o roteador está solto ou desconectado.

      Verifique se o roteador está ligado (com as luzes acesas) e se o cabo de rede está bem encaixado entre os dois aparelhos, geralmente na porta "WAN" ou "Internet" do roteador.

      Pode conferir e me confirmar?

  # /instab — Questionário de diagnóstico de instabilidade (lentidão, queda, falha específica)
  - trigger: "/instab"
    force_clipboard: true
    replace: |-
      Para eu diagnosticar essa instabilidade, me conte:

      1. O que está acontecendo exatamente? Lentidão, quedas frequentes ou falta total de conexão?
      2. A falha afeta todos os dispositivos ou só algum específico (por exemplo, só no celular ou no computador)?
      3. Acontece só no Wi-Fi ou também nos aparelhos ligados por cabo de rede?
      4. É uma falha geral ou só em algum site ou aplicativo específico (por exemplo, só no YouTube ou no WhatsApp)?

      Com essas respostas, consigo isolar o problema e resolver mais rápido.

  # /reset — Confirma sinal normal e propõe reconfiguração lógica remota do modem
  - trigger: "/reset"
    force_clipboard: true
    form: |
      Analisei a sua conexão: até o modem da Com4, os serviços estão funcionando bem.

      O sinal da fibra chega dentro dos padrões ideais, com consumo de banda regular. O seu modem está ativo e sem quedas há [[uptime]].

      Se a instabilidade continuar e você autorizar, posso refazer as configurações lógicas do seu modem por aqui (reiniciando o aparelho e recriando as regras de roteamento/bridge).

      ⚠️ Importante: nesse processo, a sua conexão vai cair por alguns instantes.

      Quer que eu faça essa reconfiguração?

  # /fast — Explica limitação do roteador Fast (100Mbps) e sugere troca por Gigabit
  - trigger: "/fast"
    force_clipboard: true
    form: |
      Analisei a sua conexão: até o modem da Com4, os serviços estão funcionando bem. O sinal da fibra está excelente, dentro dos padrões ideais, com consumo regular de banda. O seu modem está ativo e sem quedas há [[uptime]].

      A limitação de velocidade vem do seu roteador particular: é um equipamento com tecnologia "Fast", que tem um limite físico nas portas de rede de no máximo 100 Mega. Isso impede o uso da velocidade total do seu plano e ainda pode causar quedas recorrentes na rede.

      Para resolver e aproveitar 100% da sua conexão, recomendamos trocar esse roteador por um modelo "Gigabit" (Giga), com portas preparadas para velocidades mais altas, tecnologia mais recente e entrega de até 1 Giga (1000 Mbps).

      Estou enviando em anexo um PDF com alguns modelos Giga de bom custo-benefício.

      ⚠️ A Com4 faz apenas a indicação técnica. Não vendemos esses aparelhos, mas você encontra facilmente em lojas de informática ou pela internet.

      Qualquer dúvida sobre os modelos, é só chamar!

  # /roteadores — Envia o PDF de recomendação de roteadores Giga e reforça a visita gratuita
  - trigger: "/roteadores"
    force_clipboard: true
    replace: |-
      Conforme conversamos, segue em anexo o PDF com a nossa lista atualizada de roteadores Gigabit recomendados. 📄

      Todos os modelos listados possuem tecnologia avançada (Wi-Fi 6) e excelente custo-benefício, garantindo que você consiga utilizar 100% da velocidade do plano contratado sem gargalos na rede.

      Lembrando que a {{empresa_nome}} não comercializa esses aparelhos, mas você pode encontrá-los facilmente na internet (clicando no nome deles no PDF) ou em lojas de informática da região.

      E a grande vantagem: assim que você adquirir o novo equipamento, basta nos avisar! Enviaremos um técnico até o local para instalar e configurar o seu novo roteador na rede sem nenhum custo adicional. 🛠️

      Se tiver dúvidas sobre algum modelo específico antes de comprar, sigo à disposição!
    vars:
      - name: empresa_nome
        type: global

  # /visita — Coleta endereço e disponibilidade para agendar visita técnica presencial
  - trigger: "/visita"
    force_clipboard: true
    replace: |-
      Para agendar a visita técnica, confirme estas informações:

      📍 Endereço completo:
      🕒 Melhores dias e horários para receber a equipe:

      ⚠️ Avisos importantes:

      1. Os técnicos de campo atendem em horário comercial: de segunda a sexta-feira, das 08:00 às 18:00, e aos sábados, das 08:00 às 12:00.
      2. É obrigatória a presença de uma pessoa maior de 18 anos no local durante o atendimento.
      3. A equipe técnica confirma a data e o horário exatos diretamente por este canal.

  # /pppoe — Envia as credenciais de discagem (PPPoE) para configuração de roteador próprio
  - trigger: "/pppoe"
    force_clipboard: true
    replace: |-
      Conforme pedido, seguem os dados de autenticação (PPPoE) da sua conexão, para configurar o seu roteador particular:

      👤 Usuário: {{formulario.user}}
      🔑 Senha: {{formulario.senha}}

      ⚠️ Guarde estes dados com segurança: eles são exclusivos da sua assinatura e autorizam o acesso do seu equipamento à nossa rede.
    vars:
      - name: formulario
        type: form
        params:
          layout: |
            Usuário PPPoE: [[user]]
            Senha PPPoE: [[senha]]

  # /speedrouter — Orienta teste de velocidade via cabo de rede
  - trigger: "/speedrouter"
    force_clipboard: true
    replace: |-
      Para medirmos a velocidade com precisão, siga estes passos:

      1. Conecte o computador diretamente ao modem {{empresa_nome}} por cabo de rede (evite Wi-Fi).
      2. Feche downloads, streams e VPNs durante o teste.
      3. Acesse speedtest.net ou fast.com e rode o teste.
      4. Me envie o print do resultado (download e upload).

      Com isso, consigo comparar o desempenho com o plano contratado.
    vars:
      - name: empresa_nome
        type: global

  # /speedbridge — Orienta teste de velocidade via cabo com modem em Bridge (Discador PPPoE)
  - trigger: "/speedbridge"
    force_clipboard: true
    replace: |-
      Para medirmos a velocidade direto no modem em modo Bridge, precisamos criar um discador no seu computador. Siga estes passos:

      1. Conecte o computador (Windows) diretamente ao modem da {{empresa_nome}} por cabo de rede.
      2. Pressione a tecla Windows e pesquise por "Configurar uma conexão de discagem" (ou vá em Configurações > Rede e Internet > Acesso Discado > Configurar uma nova conexão).
      3. Escolha "Conectar-se à Internet" e clique em "Banda Larga (PPPoE)".
      4. Insira as credenciais da sua assinatura:
         👤 Usuário: {{formulario.user}}
         🔑 Senha: {{formulario.senha}}
      5. Clique em Conectar.
      6. Depois de conectar, feche downloads e VPNs, acesse speedtest.net ou fast.com e rode o teste.

      Por fim, me envie o print do resultado (download e upload) por aqui.
    vars:
      - name: empresa_nome
        type: global
      - name: formulario
        type: form
        params:
          layout: |
            Preencha os dados PPPoE do cliente para o teste:

            Usuário PPPoE: [[user]]
            Senha PPPoE: [[senha]]

  # /iptv — Explica instabilidade causada por bloqueios da Anatel em TV Box/IPTV
  - trigger: "/iptv"
    force_clipboard: true
    replace: |-
      Analisei a sua conexão: até o modem da Com4, os serviços estão funcionando bem, e o sinal da fibra está estável, entregando a velocidade contratada.

      A instabilidade que você está enfrentando (travamentos ou lentidão) está isolada no seu aparelho de TV Box / IPTV. Muitos desses serviços operam sem homologação e ficam atrelados à pirataria de sinal, e a própria Anatel aplica bloqueios diários e severos aos servidores desses aplicativos em todo o Brasil.

      Por isso a sua internet funciona bem no celular e no computador, mas a TV oscila. Como a restrição acontece direto na fonte do aplicativo, foge do escopo de um provedor de internet.

      Recomendamos falar direto com o fornecedor da sua TV Box / IPTV para que verifiquem rotas alternativas, servidores disponíveis ou atualizações para o aparelho.

  # /eng — Informa escalonamento do chamado para a Engenharia (Nível 2)
  - trigger: "/eng"
    force_clipboard: true
    replace: |-
      Já fizemos os testes e diagnósticos iniciais.

      Para concluir a sua solicitação, é preciso uma intervenção mais ampla na infraestrutura do servidor, então estou escalando este chamado para a Equipe de Engenharia (Nível 2).

      Eles já receberam o histórico completo do que fizemos até aqui e vão seguir com o caso.

      Você recebe retorno neste mesmo chamado quando a intervenção terminar, ou antes, se a Engenharia precisar de mais algum detalhe.

  # /congelado — Explica bloqueio por domínio congelado no Registro.br
  - trigger: "/congelado"
    force_clipboard: true
    replace: |-
      Verificamos que o seu domínio ({{formulario.dominio}}) está com o status "Congelado" no Registro.br, o órgão que regula os domínios nacionais.

      Isso costuma acontecer por uma pendência na taxa anual de renovação, e é por isso que o site e os e-mails param de funcionar.

      Como a gestão do domínio é externa, é preciso acessar o portal do Registro.br (ou falar com quem cuida do registro) para regularizar. Depois que o pagamento compensar, os serviços voltam ao normal automaticamente.
    vars:
      - name: formulario
        type: form
        params:
          layout: "Domínio afetado: [[dominio]]"

  # /pmg — Explica o painel PMG de quarentena antispam e as ações disponíveis
  - trigger: "/pmg"
    force_clipboard: true
    replace: |-
      Enviamos para a sua caixa de entrada o relatório atualizado do Gateway Antispam (PMG), com os e-mails retidos em quarentena.

      Para consultá-lo em tempo real, abra o e-mail e, logo no início da mensagem, clique na palavra "aqui" destacada nesta frase:

      "Por favor use a interface WEB clicando aqui para gerenciar os spams de sua caixa de email."

      💡 Dica: você pode mudar o idioma do painel para português. Clique no seu e-mail no canto superior direito da tela, selecione "Idioma" (ou Language) e escolha "Português Brasileiro".

      Esses remetentes retidos ainda não estão na sua lista de confiança. O filtro barra mensagens automaticamente com base na pontuação de risco (Spam Score).

      O Spam Score é um número que avalia a reputação do remetente. Ele sobe (mais risco de spam) quando o domínio de origem não tem os apontamentos de segurança corretos (SPF, DKIM e DMARC), o IP está em blacklists ou a mensagem tem links/termos suspeitos. E desce (mais confiabilidade) quando o domínio está bem autenticado e tem bom histórico de envios.

      No painel, você pode intervir manualmente com estas opções:

      ✅ Whitelist / Welcomelist: libera o e-mail da quarentena e adiciona o remetente à lista de confiança (as próximas mensagens tendem a ser liberadas). Na interface web, clique na seta ao lado do botão "Enviar" e selecione "Welcomelist".
      ❌ Blacklist / Blocklist: bloqueia novas mensagens desse remetente. Clique na seta ao lado do botão "Apagar" e selecione "Blocklist".
      📨 Entregar (Enviar): manda só aquele e-mail para a sua caixa, sem marcar o remetente como confiável.
      🗑️ Deletar (Apagar): remove o e-mail da quarentena de forma definitiva.

      Se preferir, também dá para desativar o antispam do domínio, mas isso tira uma camada importante de segurança e aumenta bastante o volume de spam, lixo eletrônico e risco de malware na caixa de entrada.

      Segue também um PDF com o passo a passo ilustrado, em anexo.
      Qualquer dúvida, seguimos à disposição! 😊

  # /cpanel — Solicita e-mail corporativo formal para envio seguro de credenciais cPanel
  - trigger: "/cpanel"
    force_clipboard: true
    replace: |-
      Para enviarmos os dados de acesso ao cPanel, precisamos que você formalize a solicitação por e-mail, enviado para {{email_atendimento}} com os itens abaixo.

      ⚠️ Importante (segurança): o e-mail precisa vir de um endereço corporativo (domínio da empresa).

      Inclua:

      • CPF ou CNPJ do titular
      • Nome completo ou Razão Social
      • Endereço de cadastro
      • Motivo da solicitação
    vars:
      - name: email_atendimento
        type: global

  # /ssl — Informa sobre propagação normal do certificado SSL recém-instalado
  - trigger: "/ssl"
    force_clipboard: true
    replace: |-
      O certificado SSL do seu domínio está sendo instalado ou renovado.

      Durante e logo depois do processo, é normal alguns navegadores mostrarem um aviso temporário de "site inseguro" ou "conexão não privada". Isso acontece porque o certificado ainda está se propagando na internet.

      ⏱️ O prazo de propagação é de até 24 horas, mas na maioria dos casos resolve em poucos minutos.

      Enquanto isso, você pode acessar normalmente: o aviso é temporário e não representa risco real agora.

      Assim que a propagação terminar, o cadeado de segurança volta a aparecer no navegador. Qualquer dúvida, sigo à disposição! 😊

  # /escopo — Delimita o escopo da Com4: infra e rede, não sistemas de terceiros
  - trigger: "/escopo"
    force_clipboard: true
    replace: |-
      Sobre esse erro na aplicação: o suporte técnico da Com4 garante a disponibilidade da infraestrutura (servidor, rede e conectividade), mas configurar, corrigir ou auditar sistemas de terceiros (ERPs, códigos particulares, plugins ou integrações de API) foge do nosso escopo.

      Recomendamos acionar o desenvolvedor responsável pela sua aplicação ou o suporte de TI local para analisar os logs do software.

  # /spamout — Trata conta de e-mail bloqueada por disparo de spam (conta comprometida)
  - trigger: "/spamout"
    force_clipboard: true
    replace: |-
      Identificamos um comportamento anômalo na sua conta de e-mail: ela foi usada para disparar um volume grande de mensagens (spam).

      Para proteger a reputação do seu domínio e do nosso servidor, bloqueamos a conta temporariamente para envios. Isso costuma acontecer quando a senha é capturada por vírus ou malware no computador do usuário.

      Para restabelecer o acesso, é preciso:
      1. Rodar uma varredura completa com antivírus em todos os dispositivos que acessam essa conta.
      2. Trocar a senha do e-mail imediatamente pelo cPanel ou Webmail (use uma senha forte, com letras, números e símbolos).

      Assim que trocar a senha, nos avise para liberarmos a conta.

  # /dnsprop — Explica propagação DNS ao cliente (2 a 24 horas)
  - trigger: "/dnsprop"
    force_clipboard: true
    replace: |-
      As alterações de DNS já foram aplicadas, mas a propagação pela internet pode levar de 2 a 24 horas.

      Nesse período, é normal que alguns usuários ainda vejam o endereço antigo ou tenham instabilidade momentânea.

      Vale esperar a propagação terminar antes de testar de novo. Qualquer dúvida, sigo à disposição!

  # /viabilidade — Informa cliente (Lead) que há viabilidade de fibra no endereço (Padrão BDC)
  - trigger: "/viabilidade"
    force_clipboard: true
    form: |
      Olá, [[nome]], {{saudacao}}!

      Boa notícia: o endereço que você informou tem viabilidade para instalação de fibra óptica! Ou seja, conseguimos te atender com a nossa internet.

      Se tiver interesse, já podemos seguir com a contratação. Você pode nos chamar no WhatsApp (16) 3706-8000 ou responder por aqui com seu nome e telefone, que um consultor entra em contato.

      Qualquer dúvida, a {{empresa_nome}} está à disposição.
      Atenciosamente,
    vars:
      - name: saudacao
        type: global
      - name: empresa_nome
        type: global

  # /semviabilidade — Informa cliente (Lead) sobre falta de viabilidade de fibra no endereço (Padrão BDC)
  - trigger: "/semviabilidade"
    force_clipboard: true
    form: |
      Olá, [[nome]], {{saudacao}}!

      Obrigado pelo interesse em contratar nossos serviços. No momento, ainda não temos viabilidade técnica no seu endereço.

      Assim que ampliarmos a nossa infraestrutura na região, entramos em contato com você.

      Qualquer dúvida, a {{empresa_nome}} está à disposição.
      Atenciosamente,
    vars:
      - name: saudacao
        type: global
      - name: empresa_nome
        type: global

  # /power — Orienta verificação da fonte de alimentação e troca de tomada
  - trigger: "/power"
    force_clipboard: true
    replace: |-
      Verifique se o cabo da fonte está bem encaixado na parte de trás do equipamento e também na tomada, por favor.

      Para descartar mau contato ou falha na rede elétrica, tire o aparelho da tomada por 1 minuto e ligue de novo, de preferência em uma tomada diferente (direto na parede, sem réguas, benjamins ou filtros de linha).

      Isso ajuda bastante na análise. Me avise assim que fizer o teste! ✅

  # /luzpower — Explica falha elétrica/hardware e abre chamado para visita técnica
  - trigger: "/luzpower"
    force_clipboard: true
    replace: |-
