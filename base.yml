  # /logbloq — Log de bloqueio no servidor/painel e encaminhamento correto
  - trigger: "/logbloq"
    force_clipboard: true
    replace: "{{resultado}}"
    vars:
      - name: formulario
        type: form
        params:
          layout: |
            Suspensão de Serviço (Bloqueio)
            Domínio / Cliente: [[dominio]]
            Servidor: [[server]]
            Tipo de Serviço: [[tipo]]
          fields:
            tipo:
              type: choice
              values: *tipo_servico_padrao
            server:
              type: choice
              values: *lista_servidores_com4
      - name: resultado
        type: shell
        params:
          shell: pwsh
          cmd: |
            [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
            $tipo = "{{formulario.tipo}}"
            $dominio = "{{formulario.dominio}}"
            $server = "{{formulario.server}}"

            if ($tipo -match "Data Center") {
                $acao = "Conta/serviço suspenso com sucesso no servidor."
                $encaminhamento = "Chamado encaminhado para a fila do Financeiro detalhando o serviço bloqueado, para alteração do status do contrato para 'Bloqueado' no sistema."
            } else {
                $acao = "Bloqueio do serviço executado via SAP/HANA."
                $encaminhamento = "Chamado encerrado."
            }

            $msg = "Suspensão de Serviço (Bloqueio)`n`nINFORMAÇÕES`n• Domínio / Cliente: $dominio`n• Servidor: $server`n• Tipo de Serviço: $tipo`n`nPROCEDIMENTOS REALIZADOS`n• Ação Realizada: $acao`n• Encaminhamento: $encaminhamento"
            Write-Output $msg

