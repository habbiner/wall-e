  - trigger: "/logromp"
    form: |
      Atendimento de Incidente Massivo (Rompimento)
      INFORMAÇÕES
      • Canal de Atendimento: [[canal]]
      • Sintoma Relatado: Cliente informa indisponibilidade de acesso à internet. Equipamento apresenta luz LOS ativa (vermelha).

      PROCEDIMENTOS E ORIENTAÇÕES
      • Diagnóstico: Identificado que o cliente foi afetado por um rompimento de fibra óptica de grande proporção na região.
      • Orientação: Cliente devidamente posicionado sobre o incidente em larga escala e informado sobre a previsão de normalização para as [[previsao]].

      SOLUÇÃO
      • Ação Realizada: Cliente ciente da indisponibilidade sistêmica e do prazo de reparo estipulado pela Engenharia/Equipe de Campo.
    form_fields:
      canal:
        type: choice
        values:
          - Blip
          - Ligação
          - E-mail

  - trigger: "/logfimromp"
    form: |
      • Incidente: Rompimento de fibra óptica na região.

      TRATATIVA E CONCLUSÃO
      • Engenharia/Equipe de Campo concluiu o reparo físico da infraestrutura.
      • Sistema de monitoramento confirmou o retorno do link (Sinal óptico normalizado / ONU online).

      Ação: Conexão normalizada com sucesso. Chamado encerrado.
