            Confira no sistema a data do ÚLTIMO boleto já gerado:
            Data (dd/mm ou dd/mm/aaaa): [[ultimo_gerado]]
      - name: resultado
        type: shell
        params:
          shell: pwsh
          cmd: |
            & "$env:CONFIG\match\scripts\calc_vencimento.ps1" -Atual "{{atual}}" -Novo "{{novo}}" -UltimoGerado "{{formulario.ultimo_gerado}}" -Modo cliente

