    replace: |-
      Para prosseguirmos com a migração da sua hospedagem para o novo servidor, precisamos da sua autorização formal por este canal.
      
      Este procedimento visa melhorar a performance e a segurança do seu serviço. Na grande maioria dos casos, as credenciais de acesso (cPanel, e-mails, FTP, banco de dados) não sofrem alterações.
      
