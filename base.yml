      Use estes dados para a conexão:
      • Host / Servidor: ftp.{{formulario.dominio}}
      • Usuário: o mesmo do seu cPanel
      • Senha: a senha do seu cPanel
      • Porta: 21

      Se o seu provedor de internet bloquear a porta 21, nos avise para vermos uma alternativa segura (SFTP).
    vars:
