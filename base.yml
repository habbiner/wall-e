      • Solicitante: [[solicitante]]
      • Validação de Segurança: Dados cadastrais/titularidade confirmados com sucesso.

      PROCEDIMENTOS E ORIENTAÇÕES
      • Motivo da solicitação: [[motivo]]
      • Cliente instruído sobre o uso seguro das credenciais PPPoE para discagem/autenticação em seu equipamento.
      
      SOLUÇÃO
      • Dados de acesso (Usuário e Senha) repassados ao cliente com sucesso. Chamado encerrado.
    form_fields:
