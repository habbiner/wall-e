        type: form
        params:
          layout: "Domínio do cliente: [[dominio]]"

  # /propag — Avisa sobre propagação DNS após migração ou alteração de apontamentos
  - trigger: "/propag"
    force_clipboard: true
    replace: |-
      A migração/alteração de DNS do domínio {{formulario.dominio}} já foi concluída aqui do nosso lado.

      A propagação global dos novos apontamentos pode levar de 2 a 24 horas, e nesse período e-mails e site podem se comportar de forma intermitente.

      Evite novas alterações de DNS nesse intervalo. Assim que a propagação estabilizar, os serviços voltam ao normal.
    vars:
      - name: formulario
        type: form
        params:
          layout: "Domínio: [[dominio]]"

  # /senhaemail — Informa que o suporte não possui acesso às senhas de contas de e-mail (Segurança)
  - trigger: "/senhaemail"
    force_clipboard: true
    replace: |-
      Por política de privacidade e segurança da informação, a {{empresa_nome}} não tem acesso para ver ou recuperar senhas de contas de e-mail individuais criadas na sua hospedagem.

      A gestão das caixas de e-mail é feita só pelo painel de controle (cPanel / Plesk). Apenas quem tem o acesso administrativo do painel, geralmente o responsável técnico da sua empresa, consegue redefinir a senha de uma conta.

      Recomendamos falar com o administrador da hospedagem ou o setor de TI da sua empresa para fazer essa alteração, tudo bem?
    vars:
      - name: empresa_nome
        type: global

  # /senhacp — Orienta redefinição de senha de e-mail via cPanel (cliente)
  - trigger: "/senhacp"
    force_clipboard: true
    replace: |-
      Para redefinir a senha de uma conta de e-mail, siga estes passos no cPanel:

      1. Acesse o painel de controle (cpanel.seudominio.com.br) com o usuário administrador.
      2. Vá em "Contas de E-mail" (Email Accounts).
      3. Localize a conta e clique em "Gerenciar" (Manage).
      4. Em "Senha", defina uma nova senha forte (letras, números e símbolos).
      5. Salve e atualize a senha nos dispositivos (Outlook, celular etc.).

      ⚠️ A {{empresa_nome}} não tem acesso às senhas individuais das contas: só o administrador do cPanel consegue alterá-las.
    vars:
      - name: empresa_nome
        type: global

  # /popimap — Explica a diferença entre os protocolos POP e IMAP
  - trigger: "/popimap"
    force_clipboard: true
    replace: |-
      Boa pergunta! A escolha entre POP e IMAP define como o seu aplicativo de e-mail (Outlook, celular) interage com as mensagens no nosso servidor.

      A diferença, direto ao ponto:

      🌐 IMAP (recomendado)
      • Sincroniza em tempo real com o servidor.
      • As mensagens ficam salvas na nuvem e você acessa de vários aparelhos ao mesmo tempo (computador, celular e webmail).
      • O que você fizer em um dispositivo (ler, apagar, mover para pastas) reflete automaticamente nos outros.

      💻 POP (POP3)
      • Baixa as mensagens para o seu aparelho e, por padrão, apaga do nosso servidor.
      • Bom se você quer economizar espaço na hospedagem ou só acessa o e-mail de um computador fixo.
      • Não sincroniza: se ler os e-mails no computador, não vai vê-los no celular depois.

      Se você acessa a mesma conta em mais de um aparelho, ou quer ter backup no servidor, o ideal é o IMAP.

      Qual você prefere, para eu te passar as portas corretas de configuração?

  # /dns — Solicita dados para criação/alteração de apontamentos DNS
  - trigger: "/dns"
    force_clipboard: true
    replace: |-
      Para criar ou alterar os apontamentos de DNS, me informe os dados exatos:

      • Tipo de registro (ex.: A, CNAME, TXT, MX)
      • Nome/Host (ex.: www, loja, mail ou @)
      • Destino/Valor/IP (ex.: 192.168.0.1 ou dominio.com)

      ⚠️ Sobre o DNS: assim que inserirmos essas chaves na nossa plataforma, começa a propagação global pela internet. Isso pode levar de 2 a 24 horas até os servidores externos reconhecerem as novas regras e o serviço voltar ao normal.

      Fico no aguardo dos dados para começarmos!

