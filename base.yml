  # /migraaponta — Avisa sobre migração de servidor e solicita atualização dos apontamentos DNS externos
  - trigger: "/migraaponta"
    force_clipboard: true
    replace: |-
      Olá, {{saudacao}}! Tudo bem? 😊

      Gostaríamos de informar que o servidor que hospeda o seu domínio {{formulario.dominio}} será migrado para uma nova infraestrutura em nosso Data Center. Esta atualização visa garantir maior estabilidade, segurança e suporte a tecnologias mais recentes.

      Identificamos que a gestão do seu DNS é externa (não está conosco). Para prosseguirmos com a migração, precisamos definir como será feita a atualização dos apontamentos:

      • Opção 01 (Nossa Gestão): Você nos fornece os dados de acesso à sua plataforma de DNS ({{formulario.plataforma}}) e a nossa engenharia realiza todas as alterações técnicas necessárias.
      • Opção 02 (Sua Gestão): Nós realizamos a migração dos dados e informamos os novos registros para que você, ou o seu técnico, realize a alteração manual.

      Nota: Onde houver o IP 189.90.13X.XXX (Tipo A), deverá ser alterado para {{formulario.novo_ip}}.

      Observações Importantes:
      • Janela de Manutenção: Durante o processo, haverá uma breve indisponibilidade do serviço. Recomendamos que a execução ocorra fora do horário comercial.
      • Credenciais: Suas senhas de e-mail e de painel de controle permanecerão as mesmas na grande maioria dos casos.

      Poderia nos confirmar qual método prefere e sugerir um dia/horário para a execução?
      Ficamos no aguardo do seu retorno para dar continuidade ao procedimento.

      Caso tenha alguma dúvida ou necessite de suporte adicional, a {{empresa_nome}} está à disposição para ajudar.
      Atenciosamente,
    vars:
      - name: empresa_nome
        type: global
      - name: saudacao
        type: global
      - name: formulario
        type: form
        params:
          layout: |
            Domínio: [[dominio]]
            Plataforma de DNS (ex: Cloudflare): [[plataforma]]
            Novo IP do servidor: [[novo_ip]]

  # /migracontato — Propõe migração de hospedagem e solicita adição como contato técnico no Registro.br
  - trigger: "/migracontato"
    force_clipboard: true
    replace: |-
      Olá, {{saudacao}}! Tudo bem? 😊

      Gostaríamos de propor a migração do domínio {{formulario.dominio}} para um de nossos servidores mais recentes, que conta com uma infraestrutura mais robusta, oferecendo melhorias significativas em desempenho e segurança.

      Caso concorde com a sugestão, recomendamos que a migração seja agendada para o final de semana, a fim de minimizar qualquer impacto no funcionamento dos serviços durante os dias úteis.

      Além disso, solicitamos que nos adicione como {{contato_registro_br}} no campo de Contato Técnico do domínio no Registro.br, o que é essencial para que possamos executar os ajustes DNS necessários relacionados à migração.

      Ficamos no aguardo da sua aprovação para dar continuidade às etapas.

      Caso tenha alguma dúvida ou necessite de suporte adicional, a {{empresa_nome}} está à disposição para ajudar.
      Atenciosamente,
    vars:
      - name: empresa_nome
        type: global
      - name: contato_registro_br
        type: global
      - name: saudacao
        type: global
      - name: formulario
        type: form
        params:
          layout: |
            Domínio: [[dominio]]

  # /renova — Envia boleto para renovação de registro de domínio
  - trigger: "/renova"
    form: |
      Olá,

      Conforme solicitado, segue em anexo o boleto para a renovação de registro do domínio [[dominio]].

      Período: [[periodo]] anos.
      Valor: R$ [[valor]].

      Obrigado pelo contato. Conte sempre conosco!

  # /dnsemail — Envia todos os apontamentos DNS necessários para e-mail com site em provedor externo
  - trigger: "/dnsemail"
    force_clipboard: true
    replace: |-
      Para que o seu site funcione no provedor externo e os seus e-mails continuem operando perfeitamente conosco, será necessário configurar os apontamentos DNS abaixo na zona de DNS do seu provedor de site atual.

      1. Apontamentos MX (Recebimento de E-mails via PMG Antispam)
      Estes são obrigatórios para que o domínio receba e-mails passando pelo nosso filtro de segurança padrão.
      • Tipo: MX | Nome: {{formulario.dominio}} (ou @) | Prioridade: 10 | Destino: mx1.com4datacenter.com.br
      • Tipo: MX | Nome: {{formulario.dominio}} (ou @) | Prioridade: 10 | Destino: mx2.com4datacenter.com.br

      2. Apontamentos de Autenticação TXT (Segurança contra Spam)
      Estes garantem que os e-mails enviados pela Com4 não caiam na caixa de spam dos destinatários.
      • Tipo: TXT | Nome: {{formulario.dominio}} (ou @) | Destino: v=spf1 +a +mx +ip4:189.90.130.0/23 -all
      • Tipo: TXT | Nome: _dmarc.{{formulario.dominio}} | Destino: v=DMARC1; p=none; fo=0; adkim=r; aspf=r; pct=100; rf=afrf; ri=86400; sp=none
      • Tipo: TXT | Nome: default._domainkey.{{formulario.dominio}} | Destino: {{formulario.dkim}}

      3. Apontamentos de Serviço E-mail (Tipo A)
      Para garantir o acesso ao painel e a comunicação dos gerenciadores (como Outlook).
      • Tipo: A | Nome: mail.{{formulario.dominio}} | Destino: 189.90.130.{{formulario.ip}}
      • Tipo: A | Nome: webmail.{{formulario.dominio}} | Destino: 189.90.130.{{formulario.ip}}
      • Tipo: A | Nome: pop.{{formulario.dominio}} | Destino: 189.90.130.{{formulario.ip}}
      • Tipo: A | Nome: imap.{{formulario.dominio}} | Destino: 189.90.130.{{formulario.ip}}
      • Tipo: A | Nome: smtp.{{formulario.dominio}} | Destino: 189.90.130.{{formulario.ip}}
      • Tipo: A | Nome: cpanel.{{formulario.dominio}} | Destino: 189.90.130.{{formulario.ip}}

      Após realizar essas configurações, o tempo de propagação DNS pode levar de 2 a 24 horas.
      Qualquer dúvida durante o processo, sigo à disposição!
    vars:
      - name: formulario
        type: form
        params:
          layout: |
            Domínio: [[dominio]]
            Chave DKIM completa: [[dkim]]
            Final do IP (ex: 200): [[ip]]

  # /autormigra — Solicita autorização formal do cliente para executar a migração de hospedagem
  - trigger: "/autormigra"
    force_clipboard: true
    replace: |-
      Para prosseguirmos com a migração da sua hospedagem para o novo servidor, precisamos da sua autorização formal por este canal.
      
      Este procedimento visa melhorar a performance e a segurança do seu serviço. Na grande maioria dos casos, as credenciais de acesso (cPanel, e-mails, FTP, banco de dados) não sofrem alterações.
      
      Você autoriza a execução desta migração? Se sim, por favor, confirme o melhor dia e horário para realizarmos o procedimento (recomendamos a execução fora do horário comercial para minimizar impactos).

  # /ftp — Envia host, usuário e porta 21 para conexão via FileZilla (FTP)
  - trigger: "/ftp"
    force_clipboard: true
    replace: |-
      Para realizar a transferência dos arquivos do seu site, recomendamos a utilização do software FileZilla (ou outro cliente FTP de sua preferência).
      
      Utilize os seguintes dados para a conexão:
      • Host / Servidor: ftp.{{formulario.dominio}}
      • Nome de Usuário: O mesmo usuário do seu cPanel
      • Senha: A senha do seu cPanel
      • Porta: 21
      
      Caso o seu provedor de internet bloqueie a porta 21, informe-nos para verificarmos uma alternativa de conexão segura (SFTP).
    vars:
      - name: formulario
        type: form
        params:
          layout: "Domínio do cliente: [[dominio]]"

  # /propag — Avisa sobre propagação DNS após migração ou alteração de apontamentos
  - trigger: "/propag"
    force_clipboard: true
    replace: |-
      Informamos que a migração/alteração de DNS do domínio {{formulario.dominio}} foi concluída em nosso ambiente.

      A propagação global dos novos apontamentos pode levar de 2 a 24 horas. Durante esse intervalo, e-mails e site podem apresentar comportamento intermitente.

      Recomendamos evitar novas alterações de DNS nesse período. Assim que a propagação estabilizar, os serviços devem operar normalmente.
    vars:
      - name: formulario
        type: form
        params:
          layout: "Domínio: [[dominio]]"

  # /senhaemail — Informa que o suporte não possui acesso às senhas de contas de e-mail (Segurança)
  - trigger: "/senhaemail"
    force_clipboard: true
    replace: |-
      Compreendo a sua solicitação. No entanto, por políticas de privacidade e segurança da informação, a {{empresa_nome}} não possui acesso para visualizar ou recuperar senhas de contas de e-mail individuais criadas dentro da sua hospedagem.
      
      A gestão das caixas de e-mail é feita exclusivamente através do painel de controle (cPanel / Plesk). Apenas o responsável técnico da sua empresa que possui o acesso administrativo a esse painel consegue realizar a redefinição de uma nova senha para a sua conta.
      
      Recomendamos que entre em contato com o administrador da sua hospedagem ou com o setor de TI da sua empresa para que eles realizem a alteração, tudo bem?
    vars:
      - name: empresa_nome
        type: global

  # /senhacp — Orienta redefinição de senha de e-mail via cPanel (cliente)
  - trigger: "/senhacp"
    force_clipboard: true
    replace: |-
      Para redefinir a senha de uma conta de e-mail, siga os passos abaixo no cPanel:

      1. Acesse o painel de controle (cpanel.seudominio.com.br) com o usuário administrador.
      2. Vá em "Contas de E-mail" (Email Accounts).
      3. Localize a conta desejada e clique em "Gerenciar" (Manage).
      4. Em "Senha", defina uma nova senha forte (letras, números e símbolos).
      5. Salve e atualize a senha nos dispositivos (Outlook, celular etc.).

      ⚠️ A {{empresa_nome}} não possui acesso às senhas individuais das contas — apenas o administrador do cPanel consegue alterá-las.
    vars:
      - name: empresa_nome
        type: global


