  # /dadospainel — Envia URLs e senhas do cPanel ou Plesk dinamicamente
  - trigger: "/dadospainel"
    force_clipboard: true
    replace: "{{resultado}}"
    vars:
      - name: saudacao
        type: global
      - name: formulario
        type: form
        params:
          layout: |
            Plataforma a enviar: [[plataforma]]
            Domínio: [[dominio]]

            -- Se for cPanel, preencha: --
            IP final (ex: 45): [[ip]]
            Usuário cPanel: [[user_cpanel]]
            Senha cPanel: [[senha_cpanel]]

            -- Se for Plesk, preencha: --
            Usuário Plesk: [[user_plesk]]
            Senha Plesk: [[senha_plesk]]
          fields:
            plataforma:
              type: choice
              values:
                - cPanel
                - Plesk
      - name: resultado
        type: shell
        params:
          shell: pwsh
          cmd: |
            [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
            $plat = "{{formulario.plataforma}}"
            $dom = "{{formulario.dominio}}"
            $ip = "{{formulario.ip}}"
            $userCp = "{{formulario.user_cpanel}}"
            $senhaCp = "{{formulario.senha_cpanel}}"
            $userPl = "{{formulario.user_plesk}}"
            $senhaPl = "{{formulario.senha_plesk}}"
            $saudacao = "{{saudacao}}"

            $msg = "Olá, ${saudacao}! Tudo bem? 😊`n`nConforme solicitado, seguem os dados de acesso ao painel de controle da hospedagem do domínio ${dom}:`n"

            if ($plat -eq "cPanel") {
                $msg += "`nPainel Administrativo cPanel:`nEndereço: https://cpanel.${dom}/ ou https://189.90.130.${ip}:2083/`nUsuário: ${userCp}`nSenha: ${senhaCp}"
            }
            elseif ($plat -eq "Plesk") {
                $msg += "`nPainel Administrativo Plesk:`nEndereço: https://plesk7.com4.com.br:8443/`nUsuário: ${userPl}`nSenha: ${senhaPl}"
            }

            Write-Output $msg

  # /ativemail — Envia dados de acesso e portas de configuração da conta de e-mail Com4
