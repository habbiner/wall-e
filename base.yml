      Se concordar, recomendamos agendar a migração para o fim de semana, para reduzir qualquer impacto nos dias úteis.

      Também precisamos que nos adicione como {{contato_registro_br}} no campo de Contato Técnico do domínio no Registro.br: isso é essencial para fazermos os ajustes de DNS da migração.

      Ficamos no aguardo da sua aprovação para seguir com as próximas etapas.

      Qualquer dúvida, a {{empresa_nome}} está à disposição.
