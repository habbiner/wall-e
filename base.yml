      Essa migração melhora a performance e a segurança do seu serviço. Na maioria dos casos, as credenciais de acesso (cPanel, e-mails, FTP, banco de dados) não mudam.

      Você autoriza a migração? Se sim, me confirme o melhor dia e horário (recomendamos fora do horário comercial, para reduzir qualquer impacto).

