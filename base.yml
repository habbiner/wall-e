  # =============================================================================

  # /lognada — Log rápido: nenhuma ação no escopo do analista
  - trigger: "/lognada"
    replace: "Sem mais ações para o meu escopo neste atendimento."

  # /logacordo — Registra desbloqueio em acordo e assume chamado para acompanhamento
  - trigger: "/logacordo"
    force_clipboard: true
    replace: "{{resultado}}"
    vars:
      - name: data_2d_uteis
        type: global
      - name: formulario
        type: form
        params:
          layout: |
            Desbloqueio em Acordo
            Canal: [[canal]]
            Nome: [[nome]]
            Telefone: [[telefone]]
            Tipo de Serviço: [[tipo]]
          fields:
            canal:
              type: choice
              values: &canal_padrao
                - Blip
                - Ligação
                - E-mail
            tipo:
              type: choice
              values: &tipo_servico_padrao
                - Data Center (cPanel, Plesk, VPS)
                - Fibra Óptica
      - name: resultado
        type: shell
        params:
          shell: powershell
          cmd: |
            [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
            $tipo = "{{formulario.tipo}}"
            $canal = "{{formulario.canal}}"
            $nome = "{{formulario.nome}}"
            $telefone = "{{formulario.telefone}}"
            $prazo = "{{data_2d_uteis}}"

            if ($tipo -match "Data Center") {
                $acao = "Desbloqueio do serviço realizado no servidor. O status no sistema de gestão permanece 'Bloqueado'."
            } else {
                $acao = "Desbloqueio em acordo executado via SAP/HANA."
            }

            $msg = "Desbloqueio em Acordo`n`nINFORMAÇÕES`n• Contato via: $canal`n• Solicitante: $nome — $telefone`n• Tipo de Serviço: $tipo`n`nPROCEDIMENTOS REALIZADOS`n• Ação: $acao`n• Prazo estendido até: $prazo.`n• Encaminhamento: Chamado assumido pelo próprio analista para acompanhamento da baixa bancária."
            Write-Output $msg

  # /logbaixa — Registra recebimento de comprovante e previsão de compensação D+1 útil
  - trigger: "/logbaixa"
    force_clipboard: true
    replace: "{{resultado}}"
    vars:
      - name: data_1d_util
        type: global
      - name: formulario
        type: form
        params:
          layout: |
            Comprovante de pagamento
            Canal: [[canal]]
            Nome: [[nome]]
            Telefone: [[telefone]]
            Tipo de Serviço: [[tipo]]
          fields:
            canal:
              type: choice
              values: *canal_padrao
            tipo:
              type: choice
              values: *tipo_servico_padrao
      - name: resultado
        type: shell
        params:
          shell: powershell
          cmd: |
            [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
            $tipo = "{{formulario.tipo}}"
            $canal = "{{formulario.canal}}"
            $nome = "{{formulario.nome}}"
            $telefone = "{{formulario.telefone}}"
            $prazo = "{{data_1d_util}}"

            if ($tipo -match "Data Center") {
                $encaminhamento = "Chamado transferido para a fila do Financeiro para validação do comprovante e acompanhamento da baixa no sistema de gestão."
            } else {
                $encaminhamento = "Chamado mantido na fila aguardando a compensação bancária automática via SAP/HANA."
            }

            $msg = "Recebimento de Comprovante`n`nINFORMAÇÕES`n• Contato via: $canal`n• Solicitante: $nome — $telefone`n• Tipo de Serviço: $tipo`n`nPROCEDIMENTOS REALIZADOS`n• Ação: Comprovante de pagamento recebido e anexado ao atendimento.`n• Previsão de compensação: $prazo`n• Encaminhamento: $encaminhamento"
            Write-Output $msg

  # /logpagou — Registra pagamento compensado e encaminha ao Financeiro (se DC) ou encerra (se Fibra)
  - trigger: "/logpagou"
    force_clipboard: true
    replace: "{{resultado}}"
    vars:
      - name: formulario
        type: form
        params:
          layout: |
            Acompanhamento de Acordo — Pagamento Confirmado
            Tipo de Serviço: [[tipo]]
          fields:
            tipo:
              type: choice
              values: *tipo_servico_padrao
      - name: resultado
        type: shell
        params:
          shell: powershell
          cmd: |
            [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
            $tipo = "{{formulario.tipo}}"

            if ($tipo -match "Data Center") {
                $encaminhamento = "Chamado transferido para a fila do Financeiro para realizar a liberação e alteração do status do contrato no sistema."
            } else {
                $encaminhamento = "Chamado de acompanhamento encerrado."
            }

            $msg = "Acompanhamento de Acordo — Pagamento Confirmado`n`n• Tipo de Serviço: $tipo`n• Status: Pagamento compensado e confirmado na plataforma.`n`nENCAMINHAMENTO`n• $encaminhamento"
            Write-Output $msg

  # /logcalote — Registra retomada da suspensão (quebra de acordo)
