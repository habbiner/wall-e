            }
            elseif ($plat -eq "Plesk") {
                $msg += "`nPainel Administrativo Plesk:`nEndereço: https://plesk7.com4.com.br:8443/`nUsuário: ${userPl}`nSenha: ${senhaPl}"
            }

            Write-Output $msg

