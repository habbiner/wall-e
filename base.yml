# =============================================================================
# 2 · Financeiro — Cliente
# =============================================================================

  # /bloqueado — Informa suspensão por fatura em aberto; oferece 2ª via ou aguarda comprovante
  - trigger: "/bloqueado"
    form: |
      Ao consultar seu cadastro, identifiquei que os serviços estão temporariamente suspensos devido a uma fatura com vencimento em [[vencimento]] que consta em aberto em nosso sistema.

      Para restaurarmos o seu acesso, envie por aqui o comprovante, caso o pagamento já tenha sido realizado.

      Ou, se preferir, posso emitir a 2ª via atualizada agora mesmo.

      Como deseja seguir?

  # /seg — Envia 2ª via do boleto com data de vencimento
  - trigger: "/seg"
    form: |
      Conforme solicitado, segue em anexo a segunda via do boleto, com vencimento em [[vencimento]].

      Por gentileza, revise os dados antes de pagar.

      Se possível, envie o comprovante por aqui para agilizarmos a baixa em nosso sistema.

  # /agendamento — Informa que o documento enviado é comprovante de agendamento, não pagamento
  - trigger: "/agendamento"
    force_clipboard: true
    replace: |-
      Analisamos o documento enviado, mas verificamos que se trata de um comprovante de agendamento.

      Para conseguirmos prosseguir com a baixa no sistema e a liberação dos seus serviços, precisamos do comprovante de pagamento efetivado.

      Por gentileza, assim que a transação for concluída pelo seu banco, nos envie o comprovante definitivo por aqui.

  # /pix — Envia chave PIX e linha digitável do boleto
  - trigger: "/pix"
    force_clipboard: true
    replace: |-
      Para agilizar o pagamento, segue abaixo a nossa chave PIX:

      🔑 Chave PIX: {{formulario.chave}}

      👤 Linha Digitável do Boleto: {{formulario.boleto}}

      Após realizar o pagamento, envie o comprovante por aqui para que possamos dar continuidade ao seu atendimento.

      ⚠️ Atenção: confirme os dados do favorecido antes de concluir a transação.
    vars:
      - name: formulario
        type: form
        params:
          layout: |
            Chave PIX: [[chave]]
            Linha Digitável do Boleto: [[boleto]]

  # /pixrapido — Envia PIX (chave do .env) + linha digitável — só pede o boleto
  - trigger: "/pixrapido"
    force_clipboard: true
    replace: |-
      Para agilizar o pagamento, segue abaixo a nossa chave PIX:

      🔑 Chave PIX (CNPJ): {{chave_pix}}

      👤 Linha Digitável do Boleto: {{formulario.boleto}}

      Após realizar o pagamento, envie o comprovante por aqui para que possamos dar continuidade ao seu atendimento.

      ⚠️ Atenção: confirme os dados do favorecido antes de concluir a transação.
    vars:
      - name: chave_pix
        type: global
      - name: formulario
        type: form
        params:
          layout: "Linha Digitável do Boleto: [[boleto]]"

  # /ofer — Oferece o desbloqueio em acordo (antes de executar); informa prazo D+2
  - trigger: "/ofer"
    force_clipboard: true
    replace: |-
      Podemos realizar um desbloqueio em acordo para que a sua conexão seja restabelecida neste momento.
      
      Esse procedimento libera os seus serviços por 2 dias úteis, tempo hábil para a compensação bancária. Caso o pagamento não seja efetivado e baixado em nosso sistema até o final do dia {{data_2d_uteis}}, o serviço será restrito novamente de forma automática.
      
      Deseja que eu realize essa liberação no seu cadastro?
    vars:
      - name: data_2d_uteis
        type: global

  # /acordo — Confirma que o desbloqueio em acordo foi realizado + prazo D+2
  - trigger: "/acordo"
    force_clipboard: true
    replace: |-
      Certo! Concluí o desbloqueio em acordo dos seus serviços nesta data.

      Em até cinco minutos o seu serviço deverá normalizar.

      Caso o pagamento não seja compensado até o final do dia {{data_2d_uteis}}, o sistema poderá aplicar um novo bloqueio automaticamente.
    vars:
      - name: data_2d_uteis
        type: global

  # /norm — Confirma desbloqueio concluído após baixa bancária confirmada
  - trigger: "/norm"
    force_clipboard: true
    replace: |-
      O desbloqueio dos seus serviços foi concluído.

      Sua conexão deve retornar à normalidade em instantes.

  # /comp — Confirma recebimento e registro do comprovante de pagamento
  - trigger: "/comp"
    force_clipboard: true
    replace: |-
      Recebemos o seu comprovante! ✅

      Ele já foi anexado ao seu cadastro financeiro.
      Muito obrigado!

  # /emailcomp — Confirmação formal de recebimento de comprovante via e-mail
  - trigger: "/emailcomp"
    form: |
      Olá, [[nome]], {{saudacao}}!

      Informamos que o comprovante foi verificado e você já pode voltar a utilizar os nossos serviços.
      Lembramos que, caso o pagamento não seja processado pelo banco dentro de 24 horas, o serviço poderá ser suspenso automaticamente.

      Caso tenha alguma dúvida ou necessite de suporte adicional, a {{empresa_nome}} está à disposição para ajudar.
      Atenciosamente,
    vars:
      - name: saudacao
        type: global
      - name: empresa_nome
        type: global

  # /faltadados — Solicita CPF/CNPJ de comprovante recebido sem identificação via e-mail
  - trigger: "/faltadados"
    form: |
      Olá, [[nome]], {{saudacao}}!

      Recebemos o comprovante de pagamento, no entanto, para que possamos localizar seu cadastro e anexá-lo corretamente, por gentileza, nos informe o CPF ou CNPJ vinculado.

      Fico no aguardo do seu retorno.

      Caso tenha alguma dúvida ou necessite de suporte adicional, a {{empresa_nome}} está à disposição para ajudar.
      Atenciosamente,
    vars:
      - name: saudacao
        type: global
      - name: empresa_nome
        type: global

  # /boletoinvertido — Cliente pagou boleto do mês posterior em vez do vigente
  - trigger: "/boletoinvertido"
    force_clipboard: true
    replace: |-
      Identificamos no sistema que o pagamento realizado foi referente à fatura do próximo mês, e não ao boleto que está vencido/vigente.
      
      Como a fatura deste mês continua em aberto, o sistema não retira o bloqueio automaticamente. Para normalizarmos o seu serviço, é necessário realizar o pagamento do boleto correto.
      
      Deseja que eu envie a 2ª via atualizada da fatura pendente?

# /venc — Alteração de vencimento com cálculo automático para o CLIENTE (BDC)
  # Uso: /venc [dia atual] [dia novo] — Exemplo: /venc 25 10
  - regex: "/venc (?P<atual>05|10|15|20|25) (?P<novo>05|10|15|20|25)"
    force_clipboard: true
    replace: "{{resultado}}"
    vars:
      - name: formulario
        type: form
        params:
          layout: |
            Alteração de vencimento: dia {{atual}} → dia {{novo}}

            Confira no sistema a data do ÚLTIMO boleto já gerado:
            Data (dd/mm ou dd/mm/aaaa): [[ultimo_gerado]]

      - name: resultado
        type: shell
        params:
          shell: powershell
          cmd: |
            [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
            $OutputEncoding = [System.Text.Encoding]::UTF8
            $atualStr = "{{atual}}"
            $novoStr  = "{{novo}}"
            $atual = [int]$atualStr
            $novo  = [int]$novoStr

            $mesesPt = @("janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro")

            $entrada = "{{formulario.ultimo_gerado}}".Trim()
            $ultimoDue = $null
            try {
                $ultimoDue = [datetime]::ParseExact($entrada, "dd/MM/yyyy", $null)
            } catch {
                try {
                    $parcial = [datetime]::ParseExact($entrada, "dd/MM", $null)
                    $ultimoDue = Get-Date -Year (Get-Date).Year -Month $parcial.Month -Day $parcial.Day
                } catch {
                    Write-Output "Data inválida ('$entrada'). Use o formato dd/mm ou dd/mm/aaaa e rode o atalho novamente."
                    exit
                }
            }

            if ($atual -eq $novo) {
                Write-Output "O dia informado como atual e o novo são iguais (dia $novoStr). Não há alteração de vencimento a ser feita."
                exit
            }

            # 1. Descobre a Data Base do Mês de Referência do Último Boleto
            if ($atual -in 5,10,15) {
                $lastRefDate = $ultimoDue.AddMonths(-1)
            } else {
                $lastRefDate = $ultimoDue
            }

            # 2. O Mês de Referência do Próximo Boleto é estritamente +1 mês
            $nextRefDate = $lastRefDate.AddMonths(1)

            # 3. Calcula quando esse próximo boleto vai vencer baseado no Novo Dia
            if ($novo -in 5,10,15) {
                $nextDueDateMonth = $nextRefDate.AddMonths(1)
            } else {
                $nextDueDateMonth = $nextRefDate
            }

            $proximoDue = Get-Date -Year $nextDueDateMonth.Year -Month $nextDueDateMonth.Month -Day $novo

            # 4. Define a Regra de Texto
            if (($atual -in 5,10,15) -and ($novo -in 20,25)) {
                $regra = "📅 Você pagará 2 boletos no mesmo mês: como o vencimento mudou para o mês vigente, você pagará o referente ao mês passado no início do mês e o deste mês no final."
            } elseif (($atual -in 20,25) -and ($novo -in 5,10,15)) {
                $regra = "📅 Haverá um intervalo maior entre vencimentos: o próximo boleto será referente ao mês anterior e só vencerá no mês seguinte, gerando um intervalo de quase 40 dias sem boleto."
            } else {
                $regra = "📅 Apenas ajuste no dia: a referência do mês de cobrança continuará a mesma, alterando apenas o dia exato do pagamento dentro do mês."
            }

            # 5. Pega os nomes dos meses em Português
            $mesUltimo  = $mesesPt[$lastRefDate.Month - 1]
            $mesProximo = $mesesPt[$nextRefDate.Month - 1]

            $ultimoStr  = $ultimoDue.ToString("dd/MM")
            $proximoStr = $proximoDue.ToString("dd/MM")

            $mensagem = "Compreendo a sua solicitação para alterar a data de vencimento para o dia $novoStr.`n`nPara alinharmos as expectativas, como as nossas datas possuem referências de cobrança diferentes (mês anterior vs. mês vigente), essa mudança gerará o seguinte ajuste no seu faturamento:`n`n$regra`n`nO cenário da sua assinatura ficará assim:`n• Último boleto gerado: vencimento em $ultimoStr (referente ao mês de $mesUltimo).`n• Próximo boleto a faturar: vencimento em $proximoStr (referente ao mês de $mesProximo).`n`nVocê está de acordo com este ajuste para que eu possa encaminhar a solicitação de alteração ao nosso setor Financeiro?"

            Write-Output $mensagem

  # /protesto — Explica o processo e encaminha título protestado ao Financeiro
  - trigger: "/protesto"
    force_clipboard: true
    replace: |-
      Compreendo a solicitação referente ao título protestado.

      Como este procedimento exige a emissão de um boleto atualizado e a posterior liberação da carta de anuência, vou encaminhar o seu atendimento diretamente para o nosso setor Financeiro.

      A equipe assumirá o caso e enviará a documentação necessária por aqui mesmo. Peço que aguarde um momento, por gentileza.

  # /comodato — Informa regras de devolução do equipamento e multa por extravio
  - trigger: "/comodato"
    force_clipboard: true
    replace: |-
      Lembramos que os equipamentos instalados (modem e fonte de alimentação) são cedidos em regime de comodato.
      
      Com o encerramento do serviço, a devolução é obrigatória. Conforme previsto em contrato, em caso de extravio, dano ou não devolução, é aplicada uma taxa de restituição no valor de R$ 525,00.
      
      Como prefere organizar a devolução? Podemos agendar a retirada pela nossa equipe técnica ou você prefere entregar diretamente em nossa sede?

  # /doctroca — Solicita documentos (PF ou PJ) para iniciar troca de titularidade
  - trigger: "/doctroca"
    form: |
      Para darmos andamento à troca de titularidade, por gentileza, nos envie os seguintes dados e documentos do **novo titular**:

      [[documentos]]
      
      Você pode nos enviar as fotos ou arquivos em PDF por aqui mesmo.
    form_fields:
      documentos:
        type: choice
        values:
          - "• Documento com foto (RG ou CNH)\n• CPF\n• Data de nascimento\n• E-mail\n• Endereço completo"
          - "• Cartão CNPJ\n• Razão social\n• Comprovante de inscrição e situação cadastral\n• E-mail\n• Endereço completo"

  # /fidelidade — Explica cláusula de fidelidade e valor da multa rescisória
  - trigger: "/fidelidade"
    form: |
      Verifiquei em nosso sistema e o seu contrato foi ativado há [[meses]] meses. 
      
      Nossos contratos de prestação de serviço possuem uma cláusula de fidelização padrão de 12 meses. Como o cancelamento está sendo solicitado antes deste período, haverá a cobrança proporcional da multa por quebra de contrato.
      
      O valor atualizado da multa rescisória é de R$ [[valor_multa]]. Você está de acordo com esta cobrança para prosseguirmos com o cancelamento?

  # /retirada — Agenda recolha do modem após cancelamento
  - trigger: "/retirada"
    force_clipboard: true
    replace: |-
      Para concluirmos o processo de cancelamento, precisamos recolher os equipamentos cedidos em comodato (modem e fonte de alimentação).
      
      Por gentileza, confirme os melhores dias e horários da próxima semana para que a nossa equipe técnica vá até o local realizar a retirada.
      
      Lembramos que é necessária a presença de um responsável maior de 18 anos no local.

  # /faturacanc — Informa valor proporcional da última fatura durante cancelamento
  - trigger: "/faturacanc"
    form: |
      Verifiquei o seu cadastro e o processo de cancelamento do serviço foi iniciado.

      Gostaria de informar que constam valores proporcionais referentes aos dias utilizados neste ciclo de faturamento, totalizando R$ [[valor_fatura]].
      
      O boleto atualizado com o valor de rescisão será enviado pelo nosso setor Financeiro. Você prefere receber esta última fatura por e-mail ou aqui mesmo pelo WhatsApp?

  # /lembretefatura — Lembrete proativo de fatura em aberto antes do bloqueio ocorrer
  - trigger: "/lembretefatura"
    form: |
      Aproveitando o nosso contato, notei ao consultar o seu cadastro que a fatura com vencimento em [[vencimento]] consta como pendente em nosso sistema.
      
      Como os seus serviços continuam ativos, decidi enviar a segunda via atualizada em anexo (ou via PIX) para facilitar a sua regularização e evitar qualquer interrupção sistêmica nos próximos dias.
      
      Se o pagamento já foi realizado, peço que desconsidere este aviso ou nos envie o comprovante para baixarmos manualmente.

  # /negado — Informa que o comprovante está ilegível ou incompleto
  - trigger: "/negado"
    force_clipboard: true
    replace: |-
      Recebemos o documento, mas não foi possível validá-lo para baixa no sistema.

      O comprovante está ilegível, incompleto ou sem os dados necessários (valor, data, favorecido ou código de autenticação).

      Por gentileza, envie uma nova imagem ou o PDF original emitido pelo banco.

  # /duplicata — Informa que o comprovante já consta registrado no sistema
  - trigger: "/duplicata"
    force_clipboard: true
    replace: |-
      Verificamos que este comprovante já consta registrado em nosso sistema.

      A baixa está em processamento ou já foi concluída. Caso o acesso ainda não tenha normalizado, nos avise para verificarmos novamente.

  # /desbloqprazo — Informa prazo de desbloqueio após compensação bancária
  - trigger: "/desbloqprazo"
    force_clipboard: true
    replace: |-
      Após a confirmação da compensação bancária em nosso sistema, o desbloqueio dos serviços ocorre de forma automática.

      O prazo médio para compensação é de 1 dia útil (previsão: {{data_1d_util}}). Assim que a baixa for registrada, a conexão deve normalizar em até cinco minutos.

      Caso o pagamento tenha sido feito via PIX, a confirmação costuma ocorrer em poucas horas.
    vars:
      - name: data_1d_util
        type: global

  # /correios — Explica o atraso na entrega física da fatura e reforça os canais digitais
  - trigger: "/correios"
    form: |
      Verifiquei o seu cadastro e confirmo que as faturas estão sendo enviadas normalmente de forma digital para o e-mail registrado: [[email]].
      
      Em relação à fatura impressa, estamos enfrentando problemas de atraso e extravio nas entregas devido a paralisações e greves dos Correios. Como a logística física é terceirizada, acaba fugindo do nosso controle garantir a data exata em que a correspondência chegará ao seu endereço neste momento.
      
      Lembramos que o envio automático por e-mail continua operando normalmente. Além disso, sempre que precisar, você pode solicitar a segunda via atualizada de forma rápida pelos nossos canais de atendimento (WhatsApp, telefone ou e-mail).
      
      Deseja que eu te envie a fatura deste mês por aqui agora mesmo?
    form_fields:
      email:
        type: text

  # /cancelapf — Informa prazo de 1 dia útil do Financeiro para cancelamento PF
  - trigger: "/cancelapf"
    force_clipboard: true
    replace: |-
      Compreendo a sua solicitação de cancelamento. 

      Estou abrindo um chamado interno e encaminhando o seu caso para o nosso setor Financeiro. Dentro de 1 dia útil, a equipe entrará em contato com você para repassar todas as informações necessárias (como faturas proporcionais e devolução de equipamentos) e finalizar o processo.
      
      Posso confirmar a abertura do chamado?

  # /cancelapj — Solicita formalização por e-mail para cancelamento PJ
  - trigger: "/cancelapj"
    force_clipboard: true
    replace: |-
      Compreendo a sua solicitação de cancelamento. 

      Como o seu cadastro é empresarial (Pessoa Jurídica), por questões de segurança corporativa, precisamos que o pedido seja formalizado por e-mail.
      
      Por gentileza, envie um e-mail para {{email_atendimento}} informando o CNPJ e o motivo do cancelamento. Assim que recebermos, o nosso setor Financeiro entrará em contato em até 1 dia útil para dar andamento e finalizar o processo.
    vars:
      - name: email_atendimento
        type: global


# =============================================================================
# 3 · Suporte Técnico — Cliente
# =============================================================================

  # /fibra — Orienta verificação visual do cabo de fibra e do conector
  - trigger: "/fibra"
    force_clipboard: true
    replace: |-
      Verifique, por favor, se o cabo de fibra óptica está bem encaixado no equipamento.

      Não é necessário retirar nem limpar o conector da fibra: ele é delicado — apenas confira se está firme na porta.

      Olhe o cabo pela parte visível (sem forçá-lo): dobras marcadas, torções ou rupturas podem indicar problema físico na conexão.

      Esses cuidados ajudam bastante na análise do caso. ✅

  # /fotos — Solicita evidências visuais do equipamento (painel de luzes e cabeamento)
  - trigger: "/fotos"
    force_clipboard: true
    replace: |-
      Para que eu possa analisar o status físico da sua conexão com maior precisão, você poderia me enviar algumas fotos dos equipamentos aí no local? 📸
      
      Por gentileza, tente capturar:
      1. A parte frontal do modem da {{empresa_nome}} (mostrando nitidamente quais luzes estão acesas, apagadas ou piscando).
      2. A parte traseira (mostrando como os cabos estão conectados).
      
      Com essas evidências visuais, consigo identificar possíveis falhas de cabeamento, travamentos ou perda de sinal de forma muito mais rápida!
    vars:
      - name: empresa_nome
        type: global

  # /los — Explica luz LOS (vermelha) e abre chamado para equipe de campo
  - trigger: "/los"
    force_clipboard: true
    replace: |-
      A luz vermelha no seu modem {{empresa_nome}} (modelo branco com o logo da {{empresa_nome}}) indica perda de sinal (LOS) — ou seja, interrupção no trecho da fibra entre o seu equipamento e a nossa rede.

      Para solucionar isso, vou registrar o seu caso com a equipe de manutenção de fibra óptica, para que restabeleçam sua conexão no menor prazo possível.
    vars:
      - name: empresa_nome
        type: global

  # /massivo — Informa ao cliente que há uma ocorrência massiva em andamento na região
  - trigger: "/massivo"
    force_clipboard: true
    replace: |-
      Identificamos uma ocorrência em andamento que pode estar afetando clientes na sua região.

      Nossa equipe técnica já está ciente e trabalhando para normalizar os serviços no menor prazo possível.

      Assim que houver atualização, retornaremos por aqui. Pedimos desculpas pelo transtorno e agradecemos pela compreensão. 🙏

  # /massivoresolvido — Notifica o cliente que a falha massiva foi resolvida pela equipe de campo
  - trigger: "/massivoresolvido"
    force_clipboard: true
    replace: |-
      Olá! Informamos que a intervenção técnica que afetava os serviços na sua região foi concluída com sucesso pela nossa equipe de Manutenção de Fibra.
      
      A sua conexão já foi restabelecida e deve operar com total normalidade. Por precaução, recomendamos que desligue o modem da tomada por 1 minuto e ligue novamente.
      
      Por gentileza, confirme se o seu acesso normalizou!

  # /romp — Informa rompimento grave de fibra óptica na região (acidente/evento externo)
  - trigger: "/romp"
    form: |
      Pedimos sinceras desculpas pela paralisação dos serviços de internet ocorrida hoje.

      A indisponibilidade foi causada por um rompimento de fibra óptica de grande proporção que atingiu a infraestrutura de rede na região. Por se tratar de um incidente em larga escala, outras operadoras também foram afetadas e estão enfrentando interrupções em seus serviços.

      As equipes responsáveis já estão trabalhando de forma contínua para realizar os reparos necessários e restabelecer a conectividade o mais rápido possível. Neste momento, a previsão para a normalização dos serviços é entre [[previsao]].

      Lamentamos os transtornos causados e agradecemos pela compreensão e paciência durante este período. Continuaremos acompanhando a situação e informaremos qualquer atualização relevante.

  # /clima — Informa interrupção causada por condições climáticas severas na área
  - trigger: "/clima"
    force_clipboard: true
    replace: |-
      Identificamos que as fortes chuvas e condições climáticas adversas na sua região afetaram o fornecimento de energia elétrica ou a infraestrutura externa da nossa rede de fibra óptica.
      
      Nossas equipes de campo já estão de prontidão e atuando para restabelecer os serviços na área afetada assim que as condições de segurança permitirem.
      
      Pedimos desculpas pelo transtorno e agradecemos a compreensão!

  # /online — Confirma que o monitoramento detectou o sinal restaurado; pede teste
  - trigger: "/online"
    force_clipboard: true
    replace: |-
      Nossos sistemas de monitoramento indicam que o sinal da sua conexão já foi restabelecido após a conclusão dos reparos.
      
      Por gentileza, realize um teste de navegação para confirmarmos se o serviço normalizou completamente. Caso o acesso ainda não tenha retornado, recomendamos reiniciar o seu equipamento (retirar o modem/roteador da tomada por 1 minuto e ligar novamente).
      
      Fico no aguardo da sua confirmação!

  # /reinicia — Orienta reinício do modem/roteador (1 minuto na tomada)
  - trigger: "/reinicia"
    force_clipboard: true
    replace: |-
      Vamos realizar um reinício simples do equipamento para normalizar a conexão:

      1. Desligue o modem (e o roteador Wi-Fi, se houver) da tomada.
      2. Aguarde 1 minuto com os aparelhos desligados.
      3. Ligue primeiro o modem e aguarde as luzes estabilizarem.
      4. Em seguida, ligue o roteador Wi-Fi (se aplicável).

      Após esse procedimento, teste o acesso e nos confirme se normalizou.

  # /wifi — Diagnóstico de instabilidade: isola problemas no Wi-Fi vs. fibra
  - trigger: "/wifi"
    force_clipboard: true
    replace: |-
      Para identificarmos se a instabilidade está no sinal da fibra ou no seu roteador Wi-Fi, verifique os seguintes pontos:

      1. Conecte um dispositivo diretamente ao modem Com4 por cabo de rede e teste a conexão. Se funcionar normalmente, o problema está no roteador Wi-Fi, não na fibra.

      2. Se usar o Wi-Fi, verifique a frequência utilizada:
         • 2,4 GHz: maior alcance, mais suscetível a interferências (micro-ondas, vizinhos).
         • 5 GHz: mais velocidade e estabilidade, porém com menor alcance.

      3. Mantenha o roteador em local aberto, longe de paredes grossas, espelhos e aparelhos eletrônicos.

      4. Reinicie o roteador (desligue por no mínimo 2 minutos e ligue novamente) e teste após a reinicialização.

      Com essas informações, consigo indicar o próximo passo com mais precisão. ✅

  # /speedwifi — Explica a limitação de velocidade via Wi-Fi e pede teste via cabo (Proposto)
  - trigger: "/speedwifi"
    force_clipboard: true
    replace: |-
      Notamos que o teste de velocidade foi realizado através da rede Wi-Fi. 
      
      O sinal sem fio sofre perda natural de pacotes e interferências do ambiente (paredes, espelhos, outros eletrônicos), não conseguindo transmitir a velocidade total da fibra óptica.
      
      Para atestarmos a real capacidade que chega ao seu equipamento, é fundamental realizar o teste com um computador conectado diretamente ao modem através de um cabo de rede. Consegue realizar este teste e nos enviar o resultado?

  # /rotoff — Informa que o modem Com4 está normal, mas o roteador do cliente está desligado/desconectado
  - trigger: "/rotoff"
    force_clipboard: true
    replace: |-
      Realizei uma análise detalhada da sua conexão e confirmo que o sinal da fibra óptica e o modem da Com4 estão operando perfeitamente. A internet está chegando com total normalidade até o local.
      
      No entanto, o nosso sistema não está detectando o seu roteador particular (que emite o Wi-Fi). Isso indica que ele pode estar desligado da energia ou que o cabo de rede que liga o modem da Com4 ao seu roteador foi desconectado/está frouxo.
      
      Por gentileza, verifique se o seu roteador está na tomada (com as luzes acesas) e confira se o cabo de rede está bem encaixado entre os dois aparelhos (geralmente na porta "WAN" ou "Internet" do seu roteador). 
      
      Pode fazer essa verificação física e me confirmar?

  # /instab — Questionário de diagnóstico de instabilidade (lentidão, queda, falha específica)
  - trigger: "/instab"
    force_clipboard: true
    replace: |-
      Para que eu possa diagnosticar a causa dessa instabilidade de forma precisa, por gentileza, detalhe os seguintes pontos:

      1. O que ocorre exatamente? (Lentidão, quedas frequentes ou falta total de conexão?)
      2. A falha afeta todos os dispositivos ou está isolada em algum específico (ex: só no celular ou no computador)?
      3. O problema ocorre apenas no Wi-Fi ou em aparelhos conectados diretamente pelo cabo de rede também?
      4. A falha é geral ou acontece apenas em algum site/aplicativo específico (ex: só no YouTube ou no WhatsApp)?

      Com essas informações, consigo isolar o foco do problema e aplicar a correção mais rapidamente.

  # /reset — Confirma sinal normal e propõe reconfiguração lógica remota do modem
  - trigger: "/reset"
    form: |
      Realizei uma análise detalhada da sua conexão e confirmo que os serviços até o modem da Com4 estão operando com total normalidade.

      O sinal da fibra óptica que chega aos seus equipamentos encontra-se dentro dos padrões ideais de operação, com consumo de banda larga regular. O seu modem, inclusive, está ativo e sem quedas há [[uptime]].

      Caso a instabilidade persista e você nos autorize, podemos refazer as configurações lógicas do seu modem por aqui (reiniciando o aparelho e recriando as regras de roteamento/bridge).

      ⚠️ Importante: se seguirmos por esse caminho, a sua conexão cairá momentaneamente durante o processo.

      Deseja que eu realize essa reconfiguração?

  # /fast — Explica limitação do roteador Fast (100Mbps) e sugere troca por Gigabit
  - trigger: "/fast"
    form: |
      Realizei uma análise detalhada da sua conexão e confirmo que os serviços até o modem da Com4 estão operando com total normalidade. O sinal da fibra óptica encontra-se excelente e dentro dos padrões ideais de operação, com consumo regular de banda larga. O seu modem, inclusive, está ativo e sem quedas há [[uptime]].

      A limitação de velocidade que está ocorrendo se deve ao seu roteador particular. Identificamos que ele é um equipamento com tecnologia "Fast". Isso significa que ele possui um limite físico nas portas de rede que restringe a passagem de internet a, no máximo, 100 Mega, impedindo que você utilize a velocidade total do seu plano — além de poder causar quedas recorrentes na rede.

      Para resolver isso e aproveitar 100% da sua conexão, a nossa recomendação técnica é que seja feita a troca desse aparelho por um roteador "Gigabit" (Giga), que possui portas preparadas para altas velocidades e tecnologias mais atualizadas, mantendo maior estabilidade e conseguindo entregar até 1 Giga (1000 Mbps).

      Para facilitar, estou enviando em anexo um PDF com alguns modelos de roteadores Giga de excelente custo-benefício que sugerimos.

      ⚠️ Importante: a Com4 realiza apenas a indicação técnica para garantir a sua melhor experiência. Nós não comercializamos estes aparelhos, mas você pode encontrá-los facilmente em lojas de informática ou na internet.

      Se tiver qualquer dúvida sobre os modelos, sigo à disposição!

  # /roteadores — Envia o PDF de recomendação de roteadores Giga e reforça a visita gratuita
  - trigger: "/roteadores"
    force_clipboard: true
    replace: |-
      Conforme conversamos, segue em anexo o PDF com a nossa lista atualizada de roteadores Gigabit recomendados. 📄

      Todos os modelos listados possuem tecnologia avançada (Wi-Fi 6) e excelente custo-benefício, garantindo que você consiga utilizar 100% da velocidade do plano contratado sem gargalos na rede.

      Lembrando que a {{empresa_nome}} não comercializa esses aparelhos, mas você pode encontrá-los facilmente na internet (clicando no nome deles no PDF) ou em lojas de informática da região.

      E a grande vantagem: assim que você adquirir o novo equipamento, basta nos avisar! Enviaremos um técnico até o local para instalar e configurar o seu novo roteador na rede sem nenhum custo adicional. 🛠️

      Se tiver dúvidas sobre algum modelo específico antes de comprar, sigo à disposição!
    vars:
      - name: empresa_nome
        type: global

  # /visita — Coleta endereço e disponibilidade para agendar visita técnica presencial
  - trigger: "/visita"
    force_clipboard: true
    replace: |-
      Para continuarmos com o agendamento da visita técnica no local, confirme, por gentileza, as informações abaixo:

      📍 Endereço completo:
      🕒 Melhores dias e horários para receber a equipe:

      ⚠️ Avisos importantes:

      1. Nossos técnicos de campo atuam em horário comercial: de segunda a sexta-feira, das 08:00 às 18:00, e aos sábados, das 08:00 às 12:00.
      2. A presença de um responsável maior de 18 anos é obrigatória no local durante o atendimento.
      3. A confirmação exata da data e horário será feita pela equipe técnica diretamente neste canal.

  # /bridge — Explica modo bridge e uso de roteador próprio com PPPoE
  - trigger: "/bridge"
    force_clipboard: true
    replace: |-
      Para utilizar o seu roteador particular com a conexão da {{empresa_nome}}, o modem da operadora precisa operar em modo Bridge (ponte).

      Nesse modo, o modem apenas entrega o sinal da fibra; autenticação (PPPoE), Wi-Fi e roteamento ficam a cargo do seu equipamento.

      Após a configuração, utilize as credenciais PPPoE da sua assinatura (solicite por aqui, se necessário).

      Se preferir, podemos agendar uma visita técnica gratuita para realizar essa configuração no local.
    vars:
      - name: empresa_nome
        type: global

  # /pppoe — Envia as credenciais de discagem (PPPoE) para configuração de roteador próprio
  - trigger: "/pppoe"
    force_clipboard: true
    replace: |-
      Conforme solicitado, seguem os dados de autenticação (PPPoE) da sua conexão, necessários para a configuração do seu roteador particular:

      👤 Usuário: {{formulario.user}}
      🔑 Senha: {{formulario.senha}}

      ⚠️ Importante: Resguarde estes dados com segurança. Eles são exclusivos da sua assinatura e autorizam o acesso do seu equipamento à nossa rede.
    vars:
      - name: formulario
        type: form
        params:
          layout: |
            Usuário PPPoE: [[user]]
            Senha PPPoE: [[senha]]

  # /speedtest — Orienta teste de velocidade via cabo de rede
  - trigger: "/speedtest"
    force_clipboard: true
    replace: |-
      Para medirmos a velocidade com precisão, realize o teste seguindo estas orientações:

      1. Conecte o computador diretamente ao modem {{empresa_nome}} por cabo de rede (evite Wi-Fi).
      2. Feche downloads, streams e VPNs durante o teste.
      3. Acesse speedtest.net ou fast.com e execute o teste.
      4. Envie por aqui o print do resultado (download e upload).

      Com isso, consigo comparar o desempenho com o plano contratado.
    vars:
      - name: empresa_nome
        type: global

  # /iptv — Explica instabilidade causada por bloqueios da Anatel em TV Box/IPTV
  - trigger: "/iptv"
    force_clipboard: true
    replace: |-
      Realizei uma análise detalhada da sua conexão e confirmo que os serviços até o modem da Com4 estão operando com total normalidade. O sinal da fibra óptica está estável e entregando a velocidade contratada perfeitamente.
      
      A instabilidade (travamentos ou lentidão) que você está enfrentando está isolada no uso do seu aparelho de TV Box / IPTV. Como muitos desses serviços operam de forma não homologada e estão frequentemente atrelados à pirataria de sinal, a própria Anatel (Agência Nacional de Telecomunicações) aplica bloqueios e restrições severas e diárias aos servidores desses aplicativos em todo o Brasil.
      
      É por isso que a sua internet funciona bem no celular e no computador, mas a transmissão da TV oscila bastante. Como a restrição ocorre direto na fonte do aplicativo, foge do escopo de atuação do provedor de internet. 
      
      Recomendamos que entre em contato direto com o fornecedor da sua TV Box / IPTV para que eles verifiquem rotas alternativas, servidores disponíveis ou atualizações para o seu aparelho.

  # /eng — Informa escalonamento do chamado para a Engenharia (Nível 2)
  - trigger: "/eng"
    force_clipboard: true
    replace: |-
      Realizamos os testes e diagnósticos iniciais.

      Porém, para concluir a sua solicitação, será preciso uma intervenção mais ampla na infraestrutura do servidor.

      Por isso, estou escalando este chamado para a Equipe de Engenharia (Nível 2).
      Eles já receberam o histórico detalhado do que fizemos até aqui e darão sequência ao caso.

      Você receberá retorno neste mesmo chamado quando a intervenção terminar ou se a Engenharia precisar de mais algum detalhe.

  # /domcong — Explica bloqueio por domínio congelado no Registro.br
  - trigger: "/domcong"
    force_clipboard: true
    replace: |-
      Ao analisar a sua conexão, verificamos que o seu domínio ({{formulario.dominio}}) encontra-se com o status "Congelado" no Registro.br, o órgão que regula os domínios nacionais.
      
      Isso geralmente ocorre devido a uma pendência na taxa anual de renovação, fazendo com que o site e os e-mails parem de funcionar.
      
      Como a gestão do domínio é externa, é necessário acessar o portal do Registro.br (ou contactar o responsável pelo registro) para regularizar a situação. Após a compensação, os serviços voltarão ao normal de forma automática.
    vars:
      - name: formulario
        type: form
        params:
          layout: "Domínio afetado: [[dominio]]"

  # /pmg — Explica o painel PMG de quarentena antispam e as ações disponíveis
  - trigger: "/pmg"
    force_clipboard: true
    replace: |-
      Enviamos para a sua caixa de entrada o relatório atualizado do Gateway Antispam (PMG), contendo os e-mails retidos em quarentena.

      Para consultá-lo em tempo real, abra o e-mail e vá até o rodapé. Localize e clique no link "web" destacado nesta parte da mensagem:

      "Por favor use a interface web para gerenciar os spams de sua caixa de e-mail".

      Observamos que esses remetentes ainda não aparecem na sua lista de confiança. O filtro atua de forma automática barrando mensagens com base na pontuação de risco (Spam Score).

      No painel, você pode usar as opções abaixo para intervir manualmente:

      ✅ Whitelist: libera o e-mail na quarentena e adiciona o remetente à lista de confiança (mensagens futuras tendem a ser liberadas).
      ❌ Blacklist: bloqueia novas mensagens desse remetente.
      📨 Entregar (Deliver): entrega somente aquele e-mail para a sua caixa, sem cadastrar o remetente como confiável.
      🗑️ Deletar (Delete): remove o e-mail da quarentena de forma permanente.

      Atenção: é possível solicitar a desativação do antispam do domínio, se desejado — porém isso retira uma camada vital de segurança e aumentará significativamente o volume de spam, lixo eletrônico e riscos de malware na caixa de entrada.

      Em apoio, segue também um PDF com o passo a passo ilustrado em anexo.
      Qualquer dúvida, seguimos à disposição! 😊

  # /cpanel — Solicita e-mail corporativo formal para envio seguro de credenciais cPanel
  - trigger: "/cpanel"
    force_clipboard: true
    replace: |-
      Para que possamos enviar os dados de acesso ao cPanel, pedimos que formalize a solicitação e realize o envio de um e-mail para {{email_atendimento}} contendo os itens listados.

      ⚠️ Importante (Segurança): o envio deve ser feito obrigatoriamente a partir de um endereço de e-mail corporativo (domínio da empresa).

      Inclua, por gentileza:

      • CPF ou CNPJ do titular
      • Nome completo ou Razão Social
      • Endereço de cadastro
      • Motivo da solicitação
    vars:
      - name: email_atendimento
        type: global

  # /ssl — Informa sobre propagação normal do certificado SSL recém-instalado
  - trigger: "/ssl"
    force_clipboard: true
    replace: |-
      O certificado SSL do seu domínio está sendo instalado/renovado.

      Durante e logo após o processo, é normal que alguns navegadores exibam temporariamente um aviso de "site inseguro" ou "conexão não privada". Isso ocorre porque o certificado ainda está sendo propagado na internet.

      ⏱️ O prazo de propagação é de até 24 horas, mas na maioria dos casos se resolve em poucos minutos.

      Enquanto isso, você pode acessar normalmente — o aviso é temporário e não representa risco real neste momento.

      Assim que a propagação for concluída, o cadeado de segurança voltará a aparecer no navegador. Qualquer dúvida, sigo à disposição! 😊

  # /escopo — Delimita o escopo da Com4: infra e rede, não sistemas de terceiros
  - trigger: "/escopo"
    force_clipboard: true
    replace: |-
      Compreendo a sua solicitação referente a este erro na aplicação.
      
      No entanto, o suporte técnico da Com4 garante a disponibilidade da infraestrutura (servidor, rede e conectividade). A configuração, correção ou auditoria de sistemas de terceiros (ERPs, códigos particulares, plugins ou integrações de API) foge ao nosso escopo de atuação.
      
      Recomendamos que acione o desenvolvedor responsável pela sua aplicação ou o seu suporte de TI local para analisar os logs do software.

  # /recursos — Alerta sobre limite de CPU/RAM no plano compartilhado e sugere VPS
  - trigger: "/recursos"
    force_clipboard: true
    replace: |-
      Realizamos a análise no servidor e identificamos que o seu site apresentou lentidão/erros devido ao consumo excessivo de recursos físicos (CPU, Memória RAM ou Processos Simultâneos) alocados para a sua conta.
      
      Na hospedagem compartilhada, existem limites de segurança para que uma conta não prejudique as demais. Recomendamos que o seu desenvolvedor otimize o banco de dados e os plugins do site para reduzir a carga.
      
      Caso o seu projeto tenha crescido e exija mais processamento constante, a solução técnica definitiva é a migração para um Servidor Virtual (VPS) dedicado. Deseja que eu encaminhe o atendimento ao Comercial para um orçamento?

  # /spamout — Trata conta de e-mail bloqueada por disparo de spam (conta comprometida)
  - trigger: "/spamout"
    force_clipboard: true
    replace: |-
      Identificamos um comportamento anômalo na sua conta de e-mail: ela foi utilizada para o disparo massivo de mensagens (SPAM).
      
      Para proteger a reputação do seu domínio e do nosso servidor, a conta foi temporariamente bloqueada para envios. Esse cenário geralmente ocorre quando a senha da conta é capturada por vírus ou malwares no computador do usuário.
      
      Para restabelecermos o acesso, é obrigatório:
      1. Realizar uma varredura completa com antivírus em todos os dispositivos que acessam esta conta.
      2. Alterar a senha do e-mail imediatamente através do cPanel ou Webmail (utilize uma senha forte com letras, números e símbolos).
      
      Assim que a senha for alterada, nos avise para realizarmos a liberação.

  # /dnsprop — Explica propagação DNS ao cliente (2 a 24 horas)
  - trigger: "/dnsprop"
    force_clipboard: true
    replace: |-
      As alterações de DNS já foram aplicadas, mas a propagação na internet pode levar de 2 a 24 horas.

      Durante esse período, é normal que alguns usuários ainda vejam o endereço antigo ou apresentem instabilidade intermitente.

      Recomendamos aguardar a conclusão da propagação antes de novos testes. Qualquer dúvida, sigo à disposição!

  # /viabilidade — Informa cliente (Lead) que há viabilidade de fibra no endereço (Padrão BDC)
  - trigger: "/viabilidade"
    form: |
      Olá, [[nome]], {{saudacao}}!

      Temos uma ótima notícia: o endereço que você nos informou possui viabilidade para instalação com fibra óptica! Isso significa que conseguimos te atender com a nossa internet de alta qualidade.
      Se tiver interesse, já podemos seguir com os próximos passos para a contratação.

      Para dar continuidade, você pode nos chamar no WhatsApp: (16) 3706-8000 ou, se preferir, é só responder por aqui com seu nome e número de telefone, que um de nossos consultores entrará em contato com você.

      Caso tenha alguma dúvida ou necessite de suporte adicional, a {{empresa_nome}} está à disposição para ajudar.
      Atenciosamente,
    vars:
      - name: saudacao
        type: global
      - name: empresa_nome
        type: global

  # /semviabilidade — Informa cliente (Lead) sobre falta de viabilidade de fibra no endereço (Padrão BDC)
  - trigger: "/semviabilidade"
    form: |
      Olá, [[nome]], {{saudacao}}!

      Agradecemos o seu interesse em contratar nossos serviços. No momento, ainda não temos viabilidade técnica para atender no seu endereço.

      Mas fique tranquilo: assim que ampliarmos nossa infraestrutura na sua região, entraremos em contato com você.

      Caso tenha alguma dúvida ou necessite de suporte adicional, a {{empresa_nome}} está à disposição para ajudar.
      Atenciosamente,
    vars:
      - name: saudacao
        type: global
      - name: empresa_nome
        type: global


