# Variáveis carregadas de match\.env (veja .env.example)
global_vars:
  - name: atendente_nome
    type: shell
    params:
      shell: powershell
      cmd: '& "$env:CONFIG\match\scripts\read-env.ps1" -Key ATENDENTE_NOME -Default "Bruno"'
  - name: empresa_nome
    type: shell
    params:
      shell: powershell
      cmd: '& "$env:CONFIG\match\scripts\read-env.ps1" -Key EMPRESA_NOME -Default "COM4"'
  - name: email_atendimento
    type: shell
    params:
      shell: powershell
      cmd: '& "$env:CONFIG\match\scripts\read-env.ps1" -Key EMAIL_ATENDIMENTO -Default "atendimento@com4.com.br"'

matches:
  # 1. Saudação Dinâmica (Verifica a hora do sistema via PowerShell)
  - trigger: "/dia"
    replace: |
      Olá, {{saudacao}}! Tudo bem? 😊
      Sou {{atendente_nome}} e vou prosseguir com o seu atendimento.
      Para que possamos dar andamento, por favor, confirme os seguintes dados:
      Nome:
      Telefone:
      E-mail:
    vars:
      - name: saudacao
        type: shell
        params:
          cmd: "$h = (Get-Date).Hour; if ($h -lt 12) { 'bom dia' } elseif ($h -lt 18) { 'boa tarde' } else { 'boa noite' }"
          shell: powershell
          
  # 2. Protocolo Automatizado (Cola o que estiver no seu Ctrl+C)
  - trigger: "/proto"
    replace: "O número do protocolo referente a este atendimento é: {{clipboard}}"
    vars:
      - name: clipboard
        type: clipboard

# 3. Desbloqueio (Calcula D+2 Dias Úteis via PowerShell)
  - trigger: "/unblock"
    replace: "Certo! Realizei o desbloqueio em acordo dos seus serviços hoje. Por favor, note que caso o pagamento não seja compensado até o final do dia {{data_2d_uteis}}, o sistema aplicará um novo bloqueio automaticamente."
    vars:
      - name: data_2d_uteis
        type: shell
        params:
          cmd: "$d = Get-Date; $c = 2; while($c -gt 0){ $d = $d.AddDays(1); if($d.DayOfWeek -ne 'Saturday' -and $d.DayOfWeek -ne 'Sunday'){ $c-- } }; $d.ToString('dd/MM/yyyy')"
          shell: powershell

  # 4. Envio de 2ª Via (Abre formulário para digitar o vencimento)
  - trigger: "/seg"
    form: |
      Conforme solicitado, segue em anexo a segunda via do boleto com vencimento em [[vencimento]]. Por gentileza, confira os dados antes de efetuar o pagamento. Se possível, nos envie o comprovante por aqui para agilizarmos a baixa no sistema.

# 5. Registro Interno de Desbloqueio (Formulário Variável + D+2 Dias Úteis)
  - trigger: "/desbloq"
    replace: |
      Contato via: {{formulario.canal}}
      Solicitante: {{formulario.nome}} - {{formulario.telefone}}
      Ação: Desbloqueio em acordo realizado.
      Prazo estendido para: {{data_2d_uteis}}.
      Aguardando baixa bancária no sistema.
    vars:
      - name: data_2d_uteis
        type: shell
        params:
          cmd: "$d = Get-Date; $c = 2; while($c -gt 0){ $d = $d.AddDays(1); if($d.DayOfWeek -ne 'Saturday' -and $d.DayOfWeek -ne 'Sunday'){ $c-- } }; $d.ToString('dd/MM/yyyy')"
          shell: powershell
      - name: formulario
        type: form
        params:
          layout: |
            Canal: [[canal]]
            Nome: [[nome]]
            Telefone: [[telefone]]
          fields:
            canal:
              type: choice
              values:
                - Blip
                - Ligação

 # 6. Registro Interno de Baixa (Formulário Variável + D+1 Dia Útil)
  - trigger: "/baixa"
    replace: |
      Contato via {{formulario.canal}}. Cliente enviou comprovante de pagamento (em anexo). 
      Chamado em aguardo de compensação bancária prevista para {{data_1d_util}}.
    vars:
      - name: data_1d_util
        type: shell
        params:
          cmd: "$d = Get-Date; $c = 1; while($c -gt 0){ $d = $d.AddDays(1); if($d.DayOfWeek -ne 'Saturday' -and $d.DayOfWeek -ne 'Sunday'){ $c-- } }; $d.ToString('dd/MM/yyyy')"
          shell: powershell
      - name: formulario
        type: form
        params:
          layout: "Canal: [[canal]]"
          fields:
            canal:
              type: choice
              values:
                - Blip
                - E-mail
                - Ligação

# ==========================================
  # TEXTOS COMPLEMENTARES: FINANCEIRO E DESBLOQUEIO
  # ==========================================
  - trigger: "/norm"
    replace: "O desbloqueio dos seus serviços foi concluído. A sua conexão retornará à normalidade em instantes."

  - trigger: "/comp"
    replace: "Recebemos o seu comprovante! Ele já foi anexado ao seu cadastro financeiro. Muito obrigado."

  # ==========================================
  # INATIVIDADE E ENCERRAMENTO (CLIENTE)
  # ==========================================
  - trigger: "/alerta"
    replace: "Olá! 😊 Ainda precisa da nossa ajuda? Como estamos há algum tempo sem interação, este atendimento será encerrado automaticamente em 30 minutos. Se precisar, é só responder!"

  - trigger: "/final"
    replace: "Como não tivemos mais retorno, estou encerrando este atendimento por inatividade. Se precisar de qualquer ajuda, basta nos chamar novamente por aqui. Estamos à disposição! 🤝"

  - trigger: "/aux"
    replace: "Posso lhe auxiliar com mais alguma solicitação hoje?"

  - trigger: "/tchau"
    replace: "A {{empresa_nome}} agradece o seu contato! Tenha um excelente dia e conte sempre conosco."

  # ==========================================
  # REGISTROS INTERNOS DE CHAMADO (FINANCEIRO/NOC)
  # ==========================================
  - trigger: "/pagou"
    replace: "Pagamento compensado e confirmado no sistema. Chamado finalizado."

  - trigger: "/calote"
    replace: "Suspensão retomada. Acordo de desbloqueio quebrado por falta de pagamento."
    # ==========================================
  # REGISTROS TÉCNICOS (NOC / GATEWAY)
  # ==========================================
  
# Registro de orientação sobre Gateway Antispam (Formulário Variável)
  - trigger: "/instruir"
    replace: |
      - O cliente entrou em contato via {{formulario.canal}} solicitando orientações técnicas sobre o funcionamento do seu gateway antispam.
      - O cliente foi devidamente instruído e orientado quanto aos procedimentos.
    vars:
      - name: formulario
        type: form
        params:
          layout: "Canal: [[canal]]"
          fields:
            canal:
              type: choice
              values:
                - Blip
                - E-mail
                - Ligação

  # Registro de encerramento por inatividade (Timeout)
  - trigger: "/timeout"
    replace: |
      O atendimento foi encerrado automaticamente em virtude da ausência de interação por parte do usuário. 
      Devido à inatividade no blip, não houve o reporte de incidentes ou solicitações, resultando na finalização do ticket por timeout sem a necessidade de intervenção técnica ou aplicação de procedimentos de troubleshooting.

  # Frase de encerramento padrão (Uso Interno)
  - trigger: "/nada"
    replace: "Nada mais a mim cabia auxiliar"

  # ==========================================
  # RESPOSTAS AO CLIENTE (PMG / RELATÓRIO)
  # ==========================================

  # Explicação detalhada sobre o Relatório do PMG
  - trigger: "/pmg"
    replace: |
      Acabamos de encaminhar para a sua caixa de entrada o relatório atualizado do seu Gateway Antispam (PMG), contendo os e-mails que foram retidos em quarentena.

      Para acessá-lo e gerenciar suas mensagens em tempo real, vá até o final do e-mail recebido e clique na palavra destacada "web" na frase: "Por favor use a interface web para gerenciar os spams de sua caixa de e-mail".

      Verificamos que os e-mails retidos ainda não constam na sua lista de remetentes confiáveis. O nosso filtro atua de forma automática barrando mensagens com base em uma pontuação de risco (Spam Score). Para que elas cheguem até você, será necessária uma intervenção manual no painel, utilizando as seguintes opções:

      ✅ **Whitelist:** Libera o e-mail retido e adiciona o remetente à sua lista de confiança, evitando que futuras mensagens dele sejam bloqueadas.
      ❌ **Blacklist:** Bloqueia permanentemente as futuras mensagens deste remetente.
      📨 **Entregar (Deliver):** Apenas entrega a mensagem específica na sua caixa de entrada, sem adicionar o remetente à lista de confiança.
      🗑️ **Deletar (Delete):** Exclui permanentemente o e-mail da quarentena.

      **Atenção:** Caso seja do seu interesse, é possível solicitar a desativação total do filtro Antispam para o seu domínio. No entanto, alertamos que isso remove a nossa principal linha de defesa, o que poderá aumentar significativamente o recebimento de spams, lixo eletrônico e vírus na sua caixa de entrada.

      Para auxiliar no processo, estou enviando em anexo um material de apoio em PDF com o passo a passo ilustrado.
      Qualquer dúvida, seguimos à disposição!
      
  # ==========================================
  # CREDENCIAIS E ACESSOS (CPANEL)
  # ==========================================

  # Solicitação de e-mail formal para envio de credenciais cPanel
  - trigger: "/cpanel"
    replace: |
      Para que possamos enviar os dados de acesso ao cPanel, solicitamos o envio de um e-mail para {{email_atendimento}} com as informações listadas abaixo.
      
      Importante: Por questões de segurança, os dados devem ser enviados obrigatoriamente de um endereço de e-mail que possua o domínio da empresa.
      
      * CPF/CNPJ do cadastro:
      * Nome completo do solicitante: 
      * Razão Social:
      * Endereço físico da empresa:
      * Motivo da solicitação:
      
  # ==========================================
  # ENCERRAMENTO SIMPLES
  # ==========================================

  - trigger: "/cha"
    replace: "chamado encerrado"
    
# ==========================================
  # VERIFICAÇÃO FÍSICA E TROUBLESHOOTING
  # ==========================================

  # Orientação de verificação do cabo Drop/Fibra
  - trigger: "/fibra"
    replace: |
      Por favor, verifique se o cabo de fibra óptica está firmemente conectado. É importante ressaltar que não é necessário remover ou limpar o cabo, pois ele é extremamente sensível. Apenas certifique-se de que a conexão esteja segura e examine o cabo em toda a sua extensão visível para verificar se há alguma dobra, torção ou rompimento. A sua atenção a estes detalhes é muito importante para resolvermos o problema.
      
# ==========================================
  # DIAGNÓSTICO DE SINAL (MODEM)
  # ==========================================

  # Explicação sobre LED de LOS (Luz Vermelha)
  - trigger: "/loss"
    replace: |
      Entendo. A luz vermelha no seu modem {{empresa_nome}} (aquele branco com o logo da {{empresa_nome}}) indica que o equipamento está com perda de sinal, ou seja, houve uma interrupção na conexão de fibra óptica com a nossa central. Para solucionar este problema, vou encaminhar a sua solicitação para o nosso setor de manutenção de fibra óptica. Eles farão os devidos reparos para restabelecer a sua conexão o mais rápido possível.
      
# ==========================================
  # AGENDAMENTO DE VISITA TÉCNICA (FIBRA/CAMPO)
  # ==========================================

  - trigger: "/visita"
    replace: |
      Para darmos andamento à sua solicitação, e prosseguir com o agendamento da visita técnica ao local. Por gentileza, nos confirme as seguintes informações:

      📍 Endereço completo:
      🕒 Dias e horários de disponibilidade para receber a equipe:

      ⚠️ **Avisos Importantes:**
      1. A visita técnica deve ser acompanhada obrigatoriamente por uma pessoa maior de 18 anos.
      2. A formalização do agendamento será realizada pela nossa equipe técnica de fibra, que entrará em contato por este mesmo telefone informando a data e o horário exatos da visita.
# ==========================================
  # INFORMATIVO DE SUSPENSÃO (FINANCEIRO)
  # ==========================================

  # Informar bloqueio por falta de pagamento
  - trigger: "/bloqueado"
    form: |
      Após verificar o seu cadastro, identifiquei que os seus serviços encontram-se temporariamente suspensos devido à fatura com vencimento em [[vencimento]] constar como aberta em nosso sistema.
      
      Para normalizarmos o seu acesso, por gentileza, nos envie o comprovante caso o pagamento já tenha sido realizado. Se precisar, posso emitir a 2ª via atualizada do boleto para você agora mesmo. Como prefere seguir?
  # ==========================================
  # ESCALONAMENTO DE CHAMADOS (N2)
  # ==========================================

  # Informar o cliente sobre escalonamento para a Engenharia
  - trigger: "/eng"
    replace: |
      Realizamos os testes e diagnósticos iniciais e verificamos que a resolução da sua solicitação exigirá uma intervenção mais avançada na infraestrutura do servidor.
      
      Por este motivo, estou escalonando o seu chamado agora mesmo para a nossa equipe de Engenharia (Nível 2). Eles já receberam todo o histórico detalhado dos testes que realizamos e assumirão a tratativa a partir deste momento.
      
      Você receberá um novo retorno neste mesmo chamado assim que a intervenção for concluída ou caso os engenheiros precisem de alguma informação adicional.