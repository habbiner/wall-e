                - Atendimento em andamento (Consultando viabilidade / Criando PN).
                - Oportunidade (Lead) registrada e transferida para a fila do Comercial.
                - Chamado encerrado (Cliente sem interesse / Negócio perdido).
                - Chamado encerrado automaticamente por inatividade (Timeout).

  # /logmaxerro — Log de bloqueio automático por limite de falhas/adiamentos por hora (Max Defers)
  - trigger: "/logmaxerro"
    force_clipboard: true
    replace: |-
      Bloqueio Automático — Max Defers and Failures

      INFORMAÇÕES
      • Canal de Atendimento: {{formulario.canal}}
      • Solicitante: {{formulario.solicitante}}
      • Domínio Afetado: {{formulario.dominio}}

      DIAGNÓSTICO E SINTOMA
      • Sintoma Relatado: Cliente recebe o retorno "exceeded the max defers and failures per hour" ao tentar enviar novos e-mails.
      • Análise NOC: Confirmado o acionamento da trava de segurança do servidor (Exim) devido a um alto índice de devoluções (envios para destinatários inválidos, incorretos ou com caixa cheia) dentro da mesma hora.

      PROCEDIMENTOS E ORIENTAÇÕES
      • Status do Fluxo: O bloqueio é temporário e o contador reseta automaticamente na virada da hora. Testes confirmam que o fluxo de envios já se encontra normalizado no momento do atendimento.
      • Orientação Passada: Cliente instruído sobre o funcionamento do bloqueio protetivo (que evita que o domínio caia em Blacklists) e fortemente orientado a realizar a higienização da sua lista de contatos/mala direta.

      SOLUÇÃO
      • Status Final: Serviços normalizados e cliente ciente das boas práticas de envio. Chamado encerrado.
    vars:
      - name: formulario
        type: form
        params:
          layout: |
            Canal: [[canal]]
            Solicitante: [[solicitante]]
            Domínio: [[dominio]]
          fields:
            canal:
              type: choice
              values: *canal_padrao
            solicitante:
              type: text
            dominio:
              type: text

