      - name: formulario
        type: form
        params:
          layout: |
            Plataforma a enviar: [[plataforma]]
            Domínio: [[dominio]]

            -- Se for cPanel, preencha: --
            IP final (ex: 45): [[ip]]
            Usuário cPanel: [[user_cpanel]]
            Senha cPanel: [[senha_cpanel]]

