          fields:
            tipo:
              type: choice
              values: *tipo_servico_padrao
      - name: resultado
        type: shell
        params:
          shell: powershell
          cmd: |
            [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
            $tipo = "{{formulario.tipo}}"

            if ($tipo -match "Data Center") {
                $acao = "Suspensão do serviço retomada no servidor por falta de pagamento dentro do prazo."
                $encaminhamento = "Chamado de acompanhamento encerrado diretamente (contrato já consta como 'Bloqueado' no sistema)."
            } else {
                $acao = "Suspensão retomada no SAP/HANA por falta de pagamento."
                $encaminhamento = "Chamado de acompanhamento encerrado."
            }

            $msg = "Acompanhamento de Acordo — Quebra de Acordo`n`n• Tipo de Serviço: $tipo`n`nPROCEDIMENTOS REALIZADOS`n• $acao`n• $encaminhamento"
            Write-Output $msg

