  # /logretornovendas — Log de retorno ativo (Instabilidade de 40 dias - Contratação)
  - trigger: "/logretornovendas"
    force_clipboard: true
    replace: |-
      Retorno Ativo — Lista de Instabilidade (Comercial)

      INFORMAÇÕES
      • Canal de Atendimento: Blip
      • Solicitante: {{formulario.nome}}
      • Telefone: {{formulario.telefone}}

      PROCEDIMENTOS REALIZADOS
      • Origem: Contato ativo realizado com base no relatório do Desenvolvimento (falha de retorno de leads nos últimos 40 dias).
      • Ação inicial: Disparo do template 'retorno_contato' efetuado no Blip.

      RESULTADO DA ABORDAGEM
      • Interação do Cliente: {{formulario.resposta}}

      SOLUÇÃO
      • Status Final: {{formulario.acao}}
    vars:
      - name: formulario
        type: form
        params:
          layout: |
            Solicitante: [[nome]]
            Telefone: [[telefone]]
            Resposta: [[resposta]]
            Status final: [[acao]]
          fields:
            nome:
              type: text
            telefone:
              type: text
            resposta:
              type: choice
              values:
                - Cliente clicou em "Sim" no template e manteve interesse.
                - Cliente clicou em "Não" / Informou que já contratou outro provedor.
                - Sem interação ou retorno do cliente após o disparo do template.
            acao:
              type: choice
