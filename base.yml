# =============================================================================
# BASE.YML — Espanso · Atendimento COM4
# Organizado por contexto · Saudação dinâmica · force_clipboard em replace multilinha
# 
# SEÇÕES:
#   1. Saudação, Identificação e Encerramento  (chat e voz com cliente)
#   2. Financeiro — Cliente                    (boletos, desbloqueios, comprovantes)
#   3. Suporte Técnico — Cliente               (fibra, LOS, diagnósticos, escalonamento)
#   4. E-mail — Hospedagem e Migração          (templates com saudação dinâmica)
#   5. Registros Internos — Financeiro         (logs para o sistema de tickets)
#   6. Registros Internos — NOC / Técnico      (logs para o sistema de tickets)
# =============================================================================

# -----------------------------------------------------------------------------
# VARIÁVEIS GLOBAIS — carregadas de match.env
# Fallback automático caso o arquivo ou a chave não sejam encontrados.
# -----------------------------------------------------------------------------
global_vars:
  - name: atendente_nome
    type: shell
    params:
      shell: powershell
      cmd: |
        $p = Join-Path $env:CONFIG 'match\.env'
        if (Test-Path $p) {
          $l = Get-Content $p | Where-Object { $_ -match '^\s*ATENDENTE_NOME\s*=' } | Select-Object -First 1
          if ($l) { (($l -split '=', 2)[1]).Trim().Trim('"').Trim("'") } else { 'Bruno' }
        } else { 'Bruno' }

  - name: empresa_nome
    type: shell
    params:
      shell: powershell
      cmd: |
        $p = Join-Path $env:CONFIG 'match\.env'
        if (Test-Path $p) {
          $l = Get-Content $p | Where-Object { $_ -match '^\s*EMPRESA_NOME\s*=' } | Select-Object -First 1
          if ($l) { (($l -split '=', 2)[1]).Trim().Trim('"').Trim("'") } else { 'COM4' }
        } else { 'COM4' }

  - name: email_atendimento
    type: shell
    params:
      shell: powershell
      cmd: |
        $p = Join-Path $env:CONFIG 'match\.env'
        if (Test-Path $p) {
          $l = Get-Content $p | Where-Object { $_ -match '^\s*EMAIL_ATENDIMENTO\s*=' } | Select-Object -First 1
          if ($l) { (($l -split '=', 2)[1]).Trim().Trim('"').Trim("'") } else { 'atendimento@com4.com.br' }
        } else { 'atendimento@com4.com.br' }


matches:

# =============================================================================
# 1. SAUDAÇÃO, IDENTIFICAÇÃO E ENCERRAMENTO
# Triggers de abertura, espera, encerramento e transferência no chat (Blip) e voz.
# =============================================================================

  # Saudação de abertura com horário dinâmico e coleta de dados do cliente (Exigência Monitoria)
  - trigger: "/ola"
    force_clipboard: true
    replace: |-
      Olá, {{saudacao}}! Tudo bem? 😊

      Sou o {{atendente_nome}} e darei sequência ao seu atendimento.

      Para continuarmos, confirme, por gentileza, os seguintes dados:

      Seu Nome Completo:
      CPF ou CNPJ:
      Telefone:
      E-mail:
    vars:
      - name: atendente_nome
        type: global
      - name: saudacao
        type: shell
        params:
          shell: powershell
          cmd: "$h = (Get-Date).Hour; if ($h -lt 12) { 'bom dia' } elseif ($h -lt 18) { 'boa tarde' } else { 'boa noite' }"

  # Registra o número de protocolo do atendimento em andamento
  - trigger: "/proto"
    form: |
      O número do protocolo referente a este atendimento é: [[protocolo]]

  # Script de retorno ativo de chamado — voz ou contato ativo no chat
  - trigger: "/retorno"
    force_clipboard: true
    replace: |-
      {{saudacao}}! Aqui é o {{atendente_nome}}, do suporte da Com4. Estou retornando o contato referente ao chamado em aberto. Podemos prosseguir?
    vars:
      - name: atendente_nome
        type: global
      - name: saudacao
        type: shell
        params:
          shell: powershell
          cmd: "$h = (Get-Date).Hour; if ($h -lt 12) { 'Bom dia' } elseif ($h -lt 18) { 'Boa tarde' } else { 'Boa noite' }"

  # Solicita pausa breve para verificação — uso obrigatório antes de consultar o sistema
  - trigger: "/espera"
    replace: "Só um momento, por gentileza, enquanto verifico as informações. ⏱️"

  # Agradecimento após pausa — obrigatório ao retornar com o cliente
  - trigger: "/obg"
    replace: "Obrigado por aguardar! Peço desculpas pela demora. 😊"

  # Informa ao cliente sobre transferência para o setor responsável
  - trigger: "/transfere"
    replace: "Vou encaminhar o seu atendimento para o setor responsável, que dará continuidade à sua solicitação. Peço que aguarde um momento, por gentileza."

  # Pergunta se o cliente precisa de mais alguma ajuda antes de encerrar
  - trigger: "/aux"
    replace: "Posso ajudar em algo mais? 😊"

  # Alerta de inatividade — aviso de encerramento automático em 30 minutos
  - trigger: "/alerta"
    force_clipboard: true
    replace: |-
      Olá! 😊

      Você ainda precisa da nossa ajuda?

      Estamos há algum tempo sem o seu retorno; por isso, este atendimento será encerrado automaticamente em 30 minutos.

      Quando precisar, é só responder por aqui!

  # Encerramento por inatividade após ausência de retorno do cliente
  - trigger: "/final"
    force_clipboard: true
    replace: |-
      Como não recebemos mais retorno, encerro este atendimento por inatividade.

      Se precisar de ajuda novamente, fale com a gente por aqui.
      Estamos à disposição! 🤝

  # Despedida padrão de encerramento com nome da empresa vindo do match.env
  - trigger: "/tchau"
    force_clipboard: true
    replace: |-
      Caso tenha qualquer outra dúvida, estamos à disposição! 😊

      A {{empresa_nome}} agradece o seu contato. Tenha um ótimo dia!
    vars:
      - name: empresa_nome
        type: global

  # Declara que nenhuma ação adicional coube ao escopo do atendimento (uso interno)
  - trigger: "/nada"
    replace: "Sem mais ações para o meu escopo neste atendimento."

  # Encerramento simples de chamado sem texto adicional (uso interno)
  - trigger: "/enc"
    replace: "Chamado encerrado."


# =============================================================================
# 2. FINANCEIRO — CLIENTE
# =============================================================================

  # Informa suspensão por fatura em aberto; oferece 2ª via ou aguarda comprovante
  - trigger: "/bloqueado"
    form: |
      Ao consultar seu cadastro, identifiquei que os serviços estão temporariamente suspensos devido a uma fatura com vencimento em [[vencimento]] que consta em aberto em nosso sistema.

      Para restaurarmos o seu acesso, envie por aqui o comprovante, caso o pagamento já tenha sido realizado.

      Ou, se preferir, posso emitir a 2ª via atualizada agora mesmo.

      Como deseja seguir?

  # Envia 2ª via de boleto com a data de vencimento preenchida no formulário
  - trigger: "/seg"
    form: |
      Conforme solicitado, segue em anexo a segunda via do boleto, com vencimento em [[vencimento]].

      Por gentileza, revise os dados antes de pagar.

      Se possível, envie o comprovante por aqui para agilizarmos a baixa em nosso sistema.

  # Informa que o documento enviado é um agendamento e solicita o comprovante efetivado
  - trigger: "/agendamento"
    force_clipboard: true
    replace: |-
      Analisamos o documento enviado, mas verificamos que se trata de um comprovante de **agendamento**.

      Para conseguirmos prosseguir com a baixa no sistema e a liberação dos seus serviços, precisamos do comprovante de **pagamento efetivado**.

      Por gentileza, assim que a transação for concluída pelo seu banco, nos envie o comprovante definitivo por aqui.

  # Confirma desbloqueio em acordo e informa prazo limite de compensação (D+2 úteis)
  - trigger: "/acordo"
    force_clipboard: true
    replace: |-
      Certo! Concluí o desbloqueio em acordo dos seus serviços nesta data.

      Em até cinco minutos o seu serviço deverá normalizar.

      Caso o pagamento não seja compensado até o final do dia {{data_2d_uteis}}, o sistema poderá aplicar um novo bloqueio automaticamente.
    vars:
      - name: data_2d_uteis
        type: shell
        params:
          shell: powershell
          cmd: "$d = Get-Date; $c = 2; while($c -gt 0){ $d = $d.AddDays(1); if($d.DayOfWeek -ne 'Saturday' -and $d.DayOfWeek -ne 'Sunday'){ $c-- } }; $d.ToString('dd/MM/yyyy')"

  # Confirma que o desbloqueio foi concluído e a conexão voltará ao normal
  - trigger: "/norm"
    force_clipboard: true
    replace: |-
      O desbloqueio dos seus serviços foi concluído.

      Sua conexão deve retornar à normalidade em instantes.

  # Confirma recebimento e registro do comprovante de pagamento enviado pelo cliente
  - trigger: "/comp"
    force_clipboard: true
    replace: |-
      Recebemos o seu comprovante! ✅

      Ele já foi anexado ao seu cadastro financeiro.
      Muito obrigado!


# =============================================================================
# 3. SUPORTE TÉCNICO — CLIENTE
# =============================================================================

  # Orienta o cliente na verificação visual do cabo de fibra óptica
  - trigger: "/fibra"
    force_clipboard: true
    replace: |-
      Verifique, por favor, se o cabo de fibra óptica está bem encaixado no equipamento.

      Não é necessário retirar nem limpar o conector da fibra: ele é delicado — apenas confira se está firme na porta.

      Olhe o cabo pela parte visível (sem forçá-lo): dobras marcadas, torções ou rupturas podem indicar problema físico na conexão.

      Esses cuidados ajudam bastante na análise do caso. ✅

  # Explica o LED de LOS (luz vermelha no modem) e registra chamado para equipe de campo
  - trigger: "/loss"
    force_clipboard: true
    replace: |-
      Entendo a sua preocupação.

      A luz vermelha no seu modem {{empresa_nome}} (modelo branco com o logo da {{empresa_nome}}) indica perda de sinal (LOS) — ou seja, interrupção no trecho da fibra entre o seu equipamento e a nossa rede.

      Para solucionar isso, vou registrar o seu caso com a equipe de manutenção de fibra óptica, para que restabeleçam sua conexão no menor prazo possível.
    vars:
      - name: empresa_nome
        type: global

  # Solicita endereço e disponibilidade para agendamento de visita técnica presencial
  - trigger: "/visita"
    force_clipboard: true
    replace: |-
      Para continuarmos com o agendamento da visita técnica no local, confirme, por gentileza, as informações abaixo:

      📍 Endereço completo:
      🕒 Melhores dias e horários para receber a equipe:

      ⚠️ Avisos importantes:

      1. A presença de um responsável maior de 18 anos é obrigatória durante a visita.
      2. A confirmação de data e horário será feita pela equipe técnica de fibra diretamente neste canal.

  # Questionário de diagnóstico de instabilidade — coleta informações do cliente
  - trigger: "/instab"
    force_clipboard: true
    replace: |-
      Para que eu possa diagnosticar a causa dessa instabilidade de forma precisa, por gentileza, detalhe os seguintes pontos:

      1. O que ocorre exatamente? (Lentidão, quedas frequentes ou falta total de conexão?)
      2. A falha afeta todos os dispositivos ou está isolada em algum específico (ex: só no celular ou no computador)?
      3. O problema ocorre apenas no Wi-Fi ou em aparelhos conectados diretamente pelo cabo de rede também?
      4. A falha é geral ou acontece apenas em algum site/aplicativo específico (ex: só no YouTube ou no WhatsApp)?

      Com essas informações, consigo isolar o foco do problema e aplicar a correção mais rapidamente.

  # Diagnóstico de roteador particular limitado (Fast vs Gigabit)
  - trigger: "/fast"
    form: |
      Realizei uma análise detalhada da sua conexão e confirmo que os serviços até o modem da Com4 estão operando com total normalidade. O sinal da fibra óptica encontra-se excelente e dentro dos padrões ideais de operação, com consumo regular de banda larga. O seu modem, inclusive, está ativo e sem quedas há [[uptime]].

      A limitação de velocidade que está ocorrendo se deve ao seu roteador particular. Identificamos que ele é um equipamento com tecnologia "Fast". Isso significa que ele possui um limite físico nas portas de rede que restringe a passagem de internet a, no máximo, 100 Mega, impedindo que você utilize a velocidade total do seu plano — além de poder causar quedas recorrentes na rede.

      Para resolver isso e aproveitar 100% da sua conexão, a nossa recomendação técnica é que seja feita a troca desse aparelho por um roteador "Gigabit" (Giga), que possui portas preparadas para altas velocidades e tecnologias mais atualizadas, mantendo maior estabilidade e conseguindo entregar até 1 Giga (1000 Mbps).

      Para facilitar, estou enviando em anexo um PDF com alguns modelos de roteadores Giga de excelente custo-benefício que sugerimos.

      ⚠️ Importante: a Com4 realiza apenas a indicação técnica para garantir a sua melhor experiência. Nós não comercializamos estes aparelhos, mas você pode encontrá-los facilmente em lojas de informática ou na internet.

      Se tiver qualquer dúvida sobre os modelos, sigo à disposição!

  # Confirma normalidade do sinal até o modem e oferece reconfiguração lógica
  - trigger: "/reset"
    form: |
      Realizei uma análise detalhada da sua conexão e confirmo que os serviços até o modem da Com4 estão operando com total normalidade.

      O sinal da fibra óptica que chega aos seus equipamentos encontra-se dentro dos padrões ideais de operação, com consumo de banda larga regular. O seu modem, inclusive, está ativo e sem quedas há [[uptime]].

      Caso a instabilidade persista e você nos autorize, podemos refazer as configurações lógicas do seu modem por aqui (reiniciando o aparelho e recriando as regras de roteamento/bridge).

      ⚠️ Importante: se seguirmos por esse caminho, a sua conexão cairá momentaneamente durante o processo.

      Deseja que eu realize essa reconfiguração?

  # Informa o cliente sobre escalonamento do chamado para Engenharia (Nível 2)
  - trigger: "/eng"
    force_clipboard: true
    replace: |-
      Realizamos os testes e diagnósticos iniciais.

      Porém, para concluir a sua solicitação, será preciso uma intervenção mais ampla na infraestrutura do servidor.

      Por isso, estou escalando este chamado para a Equipe de Engenharia (Nível 2).
      Eles já receberam o histórico detalhado do que fizemos até aqui e darão sequência ao caso.

      Você receberá retorno neste mesmo chamado quando a intervenção terminar ou se a Engenharia precisar de mais algum detalhe.

  # Explica o relatório PMG de quarentena e as ações disponíveis no painel antispam
  - trigger: "/pmg"
    force_clipboard: true
    replace: |-
      Enviamos para a sua caixa de entrada o relatório atualizado do Gateway Antispam (PMG), contendo os e-mails retidos em quarentena.

      Para consultá-lo em tempo real, abra o e-mail e vá até o rodapé. Localize e clique no link "web" destacado nesta parte da mensagem:

      "Por favor use a interface web para gerenciar os spams de sua caixa de e-mail".

      Observamos que esses remetentes ainda não aparecem na sua lista de confiança. O filtro atua de forma automática barrando mensagens com base na pontuação de risco (Spam Score).

      No painel, você pode usar as opções abaixo para intervir manualmente:

      ✅ Whitelist: libera o e-mail na quarentena e adiciona o remetente à lista de confiança (mensagens futuras tendem a ser liberadas).
      ❌ Blacklist: bloqueia novas mensagens desse remetente.
      📨 Entregar (Deliver): entrega somente aquele e-mail para a sua caixa, sem cadastrar o remetente como confiável.
      🗑️ Deletar (Delete): remove o e-mail da quarentena de forma permanente.

      Atenção: é possível solicitar a desativação do antispam do domínio, se desejado — porém isso retira uma camada vital de segurança e aumentará significativamente o volume de spam, lixo eletrônico e riscos de malware na caixa de entrada.

      Em apoio, segue também um PDF com o passo a passo ilustrado em anexo.
      Qualquer dúvida, seguimos à disposição! 😊

  # Solicita e-mail formal do cliente para envio seguro de credenciais cPanel
  - trigger: "/cpanel"
    force_clipboard: true
    replace: |-
      Para que possamos enviar os dados de acesso ao cPanel, pedimos que formalize a solicitação e realize o envio de um e-mail para {{email_atendimento}} contendo os itens listados.

      ⚠️ Importante (Segurança): o envio deve ser feito obrigatoriamente a partir de um endereço de e-mail corporativo (domínio da empresa).

      Inclua, por gentileza:

      • CPF ou CNPJ do titular
      • Nome completo ou Razão Social
      • Endereço de cadastro
      • Motivo da solicitação

    vars:
      - name: email_atendimento
        type: global


# =============================================================================
# 4. E-MAIL — HOSPEDAGEM, MIGRAÇÃO E CREDENCIAIS
# =============================================================================

  # Ativação de hospedagem — dados de acesso ao cPanel, FTP e Webmail
  - trigger: "/ativhosp"
    force_clipboard: true
    replace: |-
      Olá, {{saudacao}}! Tudo bem? 😊

      Sou o {{atendente_nome}}. Seguem abaixo os dados para acesso ao painel de controle da hospedagem {{formulario.dominio}}:

      Painel de Controle da Hospedagem:
      Endereço: http://189.90.130.{{formulario.ip}}:2082 ou cpanel.{{formulario.dominio}}
      Usuário: {{formulario.user}}
      Senha: {{formulario.senha}}

      Dados do FTP:
      Endereço: ftp.{{formulario.dominio}} ou ftp://189.90.130.{{formulario.ip}}
      Usuário: {{formulario.user}}
      Senha: {{formulario.senha}}

      WEBMAIL:
      Endereço: http://189.90.130.{{formulario.ip}}:2095/ ou webmail.{{formulario.dominio}}
      Login com a conta de e-mail e a respectiva senha.

      Configurações em gerenciador de e-mails (Ex: Outlook):
      Servidor de entrada/saída: mail.{{formulario.dominio}}
      Porta IMAP: 143
      Porta POP3: 110
      Porta de saída SMTP: 587

      Confira o PDF em anexo para verificar a documentação a respeito do nosso Gateway Antispam.

      Servidores DNS:
      {{formulario.dns}}
    vars:
      - name: atendente_nome
        type: global
      - name: saudacao
        type: shell
        params:
          shell: powershell
          cmd: "$h = (Get-Date).Hour; if ($h -lt 12) { 'bom dia' } elseif ($h -lt 18) { 'boa tarde' } else { 'boa noite' }"
      - name: formulario
        type: form
        params:
          layout: |
            Domínio: [[dominio]]
            IP final (ex: 45): [[ip]]
            Usuário: [[user]]
            Senha: [[senha]]
            DNS: [[dns]]
          fields:
            dns:
              type: choice
              values:
                - ian.ns.cloudflare.com e melinda.ns.cloudflare.com
                - coco.ns.cloudflare.com e lamar.ns.cloudflare.com

  # Dados de acesso ao cPanel e/ou Plesk enviados por e-mail ao cliente
  - trigger: "/dadospainel"
    force_clipboard: true
    replace: |-
      Olá, {{saudacao}}! Tudo bem? 😊

      Conforme solicitado, seguem os dados de acesso ao painel de controle da hospedagem do domínio {{formulario.dominio}}:

      Painel Administrativo cPanel:
      Endereço: https://cpanel.{{formulario.dominio}}/ ou https://189.90.130.{{formulario.ip}}:2083/
      Usuário: {{formulario.user}}
      Senha: {{formulario.senha}}

      Painel Administrativo Plesk:
      Endereço: https://plesk7.com4.com.br:8443/
      Usuário: {{formulario.user_plesk}}
      Senha: {{formulario.senha_plesk}}
    vars:
      - name: saudacao
        type: shell
        params:
          shell: powershell
          cmd: "$h = (Get-Date).Hour; if ($h -lt 12) { 'bom dia' } elseif ($h -lt 18) { 'boa tarde' } else { 'boa noite' }"
      - name: formulario
        type: form
        params:
          layout: |
            Domínio: [[dominio]]
            IP final (ex: 45): [[ip]]
            Usuário cPanel: [[user]]
            Senha cPanel: [[senha]]
            Usuário Plesk: [[user_plesk]]
            Senha Plesk: [[senha_plesk]]

  # Ativação de conta de e-mail Com4 — configurações para gerenciador
  - trigger: "/ativemail"
    force_clipboard: true
    replace: |-
      Olá, {{saudacao}}! Tudo bem? 😊

      Seguem abaixo os dados para acesso à sua conta de email Com4:

      WebMail:
      Endereço: webmail.com4.com.br ou http://189.90.130.10:2096/
      Usuário: {{formulario.email_cliente}}
      Senha: {{formulario.senha}}

      Configurações em gerenciador de e-mails (Ex: Outlook):
      Servidor de entrada/saída: mail.com4.com.br ou 189.90.130.10
      Usuário: {{formulario.email_cliente}}
      Porta IMAP: 143
      Porta POP3: 110
      Porta de Saída SMTP: 587

      Confira o PDF em anexo para verificar a documentação a respeito do nosso Gateway Antispam.
    vars:
      - name: saudacao
        type: shell
        params:
          shell: powershell
          cmd: "$h = (Get-Date).Hour; if ($h -lt 12) { 'bom dia' } elseif ($h -lt 18) { 'boa tarde' } else { 'boa noite' }"
      - name: formulario
        type: form
        params:
          layout: |
            E-mail do cliente: [[email_cliente]]
            Senha: [[senha]]

  # Aviso de migração de servidor para cliente com DNS gerenciado externamente
  - trigger: "/migraaponta"
    force_clipboard: true
    replace: |-
      Olá, {{saudacao}}! Tudo bem? 😊

      Gostaríamos de informar que o servidor que hospeda o seu domínio {{formulario.dominio}} será migrado para uma nova infraestrutura em nosso Data Center. Esta atualização visa garantir maior estabilidade, segurança e suporte a tecnologias mais recentes.

      Identificamos que a gestão do seu DNS é externa (não está conosco). Para prosseguirmos com a migração, precisamos definir como será feita a atualização dos apontamentos:

      • Opção 01 (Nossa Gestão): Você nos fornece os dados de acesso à sua plataforma de DNS ({{formulario.plataforma}}) e a nossa engenharia realiza todas as alterações técnicas necessárias.
      • Opção 02 (Sua Gestão): Nós realizamos a migração dos dados e informamos os novos registros para que você, ou o seu técnico, realize a alteração manual.

      Nota: Onde houver o IP 189.90.13X.XXX (Tipo A), deverá ser alterado para {{formulario.novo_ip}}.

      Observações Importantes:
      • Janela de Manutenção: Durante o processo, haverá uma breve indisponibilidade do serviço. Recomendamos que a execução ocorra fora do horário comercial.
      • Credenciais: Suas senhas de e-mail e de painel de controle permanecerão as mesmas na grande maioria dos casos.

      Poderia nos confirmar qual método prefere e sugerir um dia/horário para a execução?
      Ficamos no aguardo do seu retorno para dar continuidade ao procedimento.

      Caso tenha alguma dúvida ou necessite de suporte adicional, a Com4 está à disposição para ajudar.
      Atenciosamente,
    vars:
      - name: saudacao
        type: shell
        params:
          shell: powershell
          cmd: "$h = (Get-Date).Hour; if ($h -lt 12) { 'bom dia' } elseif ($h -lt 18) { 'boa tarde' } else { 'boa noite' }"
      - name: formulario
        type: form
        params:
          layout: |
            Domínio: [[dominio]]
            Plataforma de DNS (ex: Cloudflare): [[plataforma]]
            Novo IP do servidor: [[novo_ip]]

  # Proposta de migração de hospedagem com solicitação de contato técnico
  - trigger: "/migracontato"
    force_clipboard: true
    replace: |-
      Olá, {{saudacao}}! Tudo bem? 😊

      Gostaríamos de propor a migração do domínio {{formulario.dominio}} para um de nossos servidores mais recentes, que conta com uma infraestrutura mais robusta, oferecendo melhorias significativas em desempenho e segurança.

      Caso concorde com a sugestão, recomendamos que a migração seja agendada para o final de semana, a fim de minimizar qualquer impacto no funcionamento dos serviços durante os dias úteis.

      Além disso, solicitamos que nos adicione como PHF5 no campo de Contato Técnico do domínio no Registro.br, o que é essencial para que possamos executar os ajustes DNS necessários relacionados à migração.

      Ficamos no aguardo da sua aprovação para dar continuidade às etapas.

      Caso tenha alguma dúvida ou necessite de suporte adicional, a Com4 está à disposição para ajudar.
      Atenciosamente,
    vars:
      - name: saudacao
        type: shell
        params:
          shell: powershell
          cmd: "$h = (Get-Date).Hour; if ($h -lt 12) { 'bom dia' } elseif ($h -lt 18) { 'boa tarde' } else { 'boa noite' }"
      - name: formulario
        type: form
        params:
          layout: |
            Domínio: [[dominio]]

  # E-mail com boleto de renovação de registro de domínio
  - trigger: "/renova"
    form: |
      Olá,

      Conforme solicitado, segue em anexo o boleto para a renovação de registro do domínio [[dominio]].

      Período: [[periodo]] anos.
      Valor: R$ [[valor]].

      Obrigado pelo contato. Conte sempre conosco!

  # Orientações de DNS para Site em outro provedor e E-mail na Com4
  - trigger: "/dnsemail"
    force_clipboard: true
    replace: |-
      Para que o seu site funcione no provedor externo e os seus e-mails continuem operando perfeitamente conosco, será necessário configurar os apontamentos DNS abaixo na zona de DNS do seu provedor de site atual.

      1. Apontamentos MX (Recebimento de E-mails via PMG Antispam)
      Estes são obrigatórios para que o domínio receba e-mails passando pelo nosso filtro de segurança padrão.
      • Tipo: MX | Nome: {{formulario.dominio}} (ou @) | Prioridade: 10 | Destino: mx1.com4datacenter.com.br
      • Tipo: MX | Nome: {{formulario.dominio}} (ou @) | Prioridade: 10 | Destino: mx2.com4datacenter.com.br

      2. Apontamentos de Autenticação TXT (Segurança contra Spam)
      Estes garantem que os e-mails enviados pela Com4 não caiam na caixa de spam dos destinatários.
      • Tipo: TXT | Nome: {{formulario.dominio}} (ou @) | Destino: v=spf1 +a +mx +ip4:189.90.130.0/23 -all
      • Tipo: TXT | Nome: _dmarc.{{formulario.dominio}} | Destino: v=DMARC1; p=none; fo=0; adkim=r; aspf=r; pct=100; rf=afrf; ri=86400; sp=none
      • Tipo: TXT | Nome: default._domainkey.{{formulario.dominio}} | Destino: {{formulario.dkim}}

      3. Apontamentos de Serviço E-mail (Tipo A)
      Para garantir o acesso ao painel e a comunicação dos gerenciadores (como Outlook).
      • Tipo: A | Nome: mail.{{formulario.dominio}} | Destino: 189.90.130.{{formulario.ip}}
      • Tipo: A | Nome: webmail.{{formulario.dominio}} | Destino: 189.90.130.{{formulario.ip}}
      • Tipo: A | Nome: pop.{{formulario.dominio}} | Destino: 189.90.130.{{formulario.ip}}
      • Tipo: A | Nome: imap.{{formulario.dominio}} | Destino: 189.90.130.{{formulario.ip}}
      • Tipo: A | Nome: smtp.{{formulario.dominio}} | Destino: 189.90.130.{{formulario.ip}}
      • Tipo: A | Nome: cpanel.{{formulario.dominio}} | Destino: 189.90.130.{{formulario.ip}}

      Após realizar essas configurações, o tempo de propagação DNS pode levar de 2 a 24 horas.
      Qualquer dúvida durante o processo, sigo à disposição!
    vars:
      - name: formulario
        type: form
        params:
          layout: |
            Domínio: [[dominio]]
            Chave DKIM completa: [[dkim]]
            Final do IP (ex: 200): [[ip]]


