  # /migraaponta — Avisa sobre migração de servidor e solicita atualização dos apontamentos DNS externos
  - trigger: "/migraaponta"
    force_clipboard: true
    replace: |-
      Olá, {{saudacao}}! Tudo bem? 😊

      O servidor que hospeda o seu domínio {{formulario.dominio}} vai ser migrado para uma nova infraestrutura no nosso Data Center, o que traz mais estabilidade, segurança e suporte a tecnologias recentes.

      A gestão do seu DNS é externa, não está com a gente. Para seguirmos com a migração, precisamos definir como atualizar os apontamentos:

      • Opção 1 (nossa gestão): você nos passa os dados de acesso da sua plataforma de DNS ({{formulario.plataforma}}), e a nossa engenharia faz as alterações técnicas.
      • Opção 2 (sua gestão): nós migramos os dados e te passamos os novos registros, para você ou o seu técnico fazer a alteração manual.

      Nota: onde houver o IP 189.90.13X.XXX (tipo A), ele precisa mudar para {{formulario.novo_ip}}.

      Observações importantes:
      • Janela de manutenção: o serviço fica brevemente indisponível durante o processo, então recomendamos executar fora do horário comercial.
      • Credenciais: na maioria dos casos, as senhas de e-mail e do painel de controle continuam as mesmas.

      Qual método você prefere, e qual dia/horário sugere para a execução?
      Ficamos no aguardo do seu retorno para seguir com o procedimento.

      Qualquer dúvida, a {{empresa_nome}} está à disposição.
      Atenciosamente,
    vars:
      - name: empresa_nome
        type: global
      - name: saudacao
        type: global
      - name: formulario
        type: form
        params:
          layout: |
            Domínio: [[dominio]]
            Plataforma de DNS (ex: Cloudflare): [[plataforma]]
            Novo IP do servidor: [[novo_ip]]

