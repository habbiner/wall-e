        type: form
        params:
          layout: "Domínio do cliente: [[dominio]]"

  # /propag — Avisa sobre propagação DNS após migração ou alteração de apontamentos
  - trigger: "/propag"
    force_clipboard: true
    replace: |-
      Informamos que a migração/alteração de DNS do domínio {{formulario.dominio}} foi concluída em nosso ambiente.

      A propagação global dos novos apontamentos pode levar de 2 a 24 horas. Durante esse intervalo, e-mails e site podem apresentar comportamento intermitente.

      Recomendamos evitar novas alterações de DNS nesse período. Assim que a propagação estabilizar, os serviços devem operar normalmente.
    vars:
