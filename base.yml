  # /logbackup — Log interno de solicitação de restauração de backup (Hospedagem ou VPS)
  - trigger: "/logbackup"
    force_clipboard: true
    replace: "{{resultado}}"
    vars:
      - name: formulario
        type: form
        params:
          layout: |
            Solicitação de Restauração de Backup

            Canal de Atendimento: [[canal]]
            Solicitante: [[solicitante]]
            Origem do Backup: [[origem]]

            -- Se Hospedagem (cPanel/Plesk), preencha: --
            Hospedagem / Domínio: [[hospedagem]]
            Servidor: [[servidor_com4]]

            -- Se VPS / Servidor Dedicado, preencha: --
            IP do Servidor VPS: [[vps_ip]]
            Autorização do cliente (reinício/indisponibilidade temporária): [[autorizacao_vps]]

            Tipo de Restauração: [[tipo]]

            -- Se E-mail, preencha: --
            Conta de E-mail Afetada: [[email_afetado]]

            -- Se Pasta/Arquivo Específico (VPS), preencha: --
            Caminho / Pasta Específica: [[pasta_especifica]]

            Data ou ponto de backup solicitado: [[data_backup]]

            Observações: [[acoes]]
          fields:
            canal:
              type: choice
              values: *canal_padrao
            origem:
              type: choice
              values:
                - Hospedagem (cPanel/Plesk)
                - VPS / Servidor Dedicado
            servidor_com4:
              type: choice
              values: *lista_servidores_com4
            autorizacao_vps:
              type: choice
              values:
                - Não se aplica (Hospedagem)
                - Sim
                - Não
            tipo:
              type: choice
              values:
                - Site (Arquivos)
                - Site (Banco de Dados)
                - E-mail
                - VPS Completa
                - VPS - Pasta/Arquivo Específico
            acoes:
              type: text
              multiline: true
      - name: resultado
        type: shell
        params:
          shell: powershell
          cmd: |
            [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
            $canal = @'
            {{formulario.canal}}
            '@.Trim()
            $solicitante = @'
            {{formulario.solicitante}}
            '@.Trim()
            $origem = @'
            {{formulario.origem}}
            '@.Trim()
            $hospedagem = @'
            {{formulario.hospedagem}}
            '@.Trim()
            $servidor = @'
            {{formulario.servidor_com4}}
            '@.Trim()
            $vpsIp = @'
            {{formulario.vps_ip}}
            '@.Trim()
            $autorizacaoVps = @'
            {{formulario.autorizacao_vps}}
            '@.Trim()
            $tipo = @'
            {{formulario.tipo}}
            '@.Trim()
            $emailAfetado = @'
            {{formulario.email_afetado}}
            '@.Trim()
            $pastaEspecifica = @'
            {{formulario.pasta_especifica}}
            '@.Trim()
            $dataBackup = @'
            {{formulario.data_backup}}
            '@.Trim()
            $acoes = @'
            {{formulario.acoes}}
            '@.Trim()

            $msg = "Solicitação de Restauração de Backup`n`nINFORMAÇÕES`n• Canal de Atendimento: $canal`n• Solicitante: $solicitante`n• Origem: $origem`n"

            if ($origem -match "Hospedagem") {
                $msg += "• Hospedagem / Domínio: $hospedagem`n• Servidor: $servidor`n"
            } else {
                $msg += "• IP do Servidor VPS: $vpsIp`n• Autorização do Cliente: $autorizacaoVps`n"
            }

            $msg += "`nDETALHES DA RESTAURAÇÃO`n• Tipo: $tipo`n"

            if ($tipo -eq "E-mail") {
                $msg += "• Conta de E-mail Afetada: $emailAfetado`n"
            }
            if ($tipo -match "Pasta/Arquivo") {
                $msg += "• Caminho / Pasta Específica: $pastaEspecifica`n"
            }
            if ($dataBackup -ne "") {
                $msg += "• Data/Ponto de Backup Solicitado: $dataBackup`n"
            }

            if ($acoes -ne "") {
                $msg += "`nOBSERVAÇÃO`n$acoes"
            }

            Write-Output $msg

