  # /logreset — Log interno de reconfiguração lógica / reset remoto da ONU
  - trigger: "/logreset"
    form: |
      Reconfiguração Lógica / Reset de Equipamento
      
      INFORMAÇÕES
      • Canal de Atendimento: [[canal]]
      • Sintoma Relatado: [[sintoma]]

      DIAGNÓSTICO E VERIFICAÇÕES
      • Sinal Óptico: Dentro dos padrões ideais.
      • Uptime da ONU: [[uptime]]
      • Análise: Link físico estável. Sintoma relatado apontava para travamento lógico ou falha de roteamento no equipamento da Com4.

      PROCEDIMENTOS REALIZADOS
      • Autorização: Cliente devidamente orientado e autorizou a queda momentânea do link.
      • Ações executadas: Realizado o reboot remoto da ONU e a recriação das configurações lógicas (regras de roteamento/bridge).

      SOLUÇÃO
      • Status após reconfiguração: [[status]]
    form_fields:
      canal:
        type: choice
        values:
          - Blip
          - Ligação
          - E-mail
      sintoma:
        type: choice
        values:
          - Lentidão
          - Quedas frequentes / Instabilidade
          - Sem navegação (mas com equipamento online)
      uptime:
        type: text
      status:
        type: choice
        values:
          - Conexão normalizada com sucesso. Chamado encerrado.
          - Falha persiste — Aberta visita técnica para verificação/troca no local.
          - Falha persiste — Chamado escalonado para a Engenharia.

  # /logiptv — Log interno de diagnóstico de instabilidade isolada em TV Box/IPTV
  - trigger: "/logiptv"
    form: |
      Diagnóstico de Instabilidade — TV Box / IPTV
      
      INFORMAÇÕES
      • Canal de Atendimento: [[canal]]
      • Sintoma Relatado: Cliente relata lentidão/travamentos na conexão, isolados no uso de TV Box/IPTV.

      TESTES E VERIFICAÇÕES
      • Sinal Óptico e Uptime: Dentro dos padrões ideais.
      • Consumo de Banda: Operando normalmente (demais dispositivos na rede navegam sem falhas).
      • Diagnóstico NOC 1: Instabilidade externa e isolada nos servidores do aplicativo de IPTV do cliente.

      ORIENTAÇÕES REPASSADAS
      • Cliente posicionado de que a infraestrutura e a entrega de banda da Com4 estão em plena normalidade.
      • Explicado que serviços de IPTV não homologados sofrem restrições e bloqueios frequentes pela Anatel.
      • Orientado a buscar suporte diretamente com o fornecedor do serviço de IPTV para rotas ou atualizações alternativas.

      SOLUÇÃO
      • Infraestrutura Com4 validada e sem falhas. Chamado encerrado.
    form_fields:
      canal:
        type: choice
        values:
          - Blip
          - Ligação
          - E-mail

  # /logrotoff — Log de roteador do cliente desligado/desconectado da ONU
  - trigger: "/logrotoff"
    form: |
      Diagnóstico de Equipamento Particular — Roteador Inacessível
      
      INFORMAÇÕES
      • Canal de Atendimento: [[canal]]
      • Sintoma Relatado: Cliente informa falta de conexão à internet.

      TESTES E PROCEDIMENTOS
      • Análise NOC 1: Sinal óptico e uptime da ONU Com4 normais. Equipamento autenticado e recebendo link.
      • Diagnóstico: Identificada ausência de tráfego/mac-address do roteador particular na porta LAN da ONU (Equipamento do cliente desligado ou cabo desconectado).

      ORIENTAÇÕES REPASSADAS AO CLIENTE
      • Confirmada a integridade da rede da Com4 até o modem.
      • Cliente orientado a verificar a alimentação de energia do roteador próprio e o encaixe físico do cabo de rede entre a ONU e a porta WAN.

      SOLUÇÃO
      • Status: [[status]]
    form_fields:
      canal:
        type: choice
        values:
          - Blip
          - Ligação
          - E-mail
      status:
        type: choice
        values:
          - Equipamento religado/reconectado. Conexão normalizada com sucesso.
          - Falha física no roteador do cliente constatada. Orientado a acionar suporte de TI.
          - Cliente não retornou após orientações. Mantido em aberto.

  # /logsenha — Log interno para abertura de visita técnica (Troca de senha Wi-Fi)
  - trigger: "/logsenha"
    form: |
      Abertura de Visita Técnica — Configuração Wi-Fi
      
      INFORMAÇÕES
      • Canal de Atendimento: [[canal]]
      • Solicitante: [[solicitante]]
      • Contato atualizado: [[contato]]

      DIAGNÓSTICO E SOLICITAÇÃO
      • Motivo da Visita: Cliente solicita a alteração do nome da rede (SSID) e/ou senha do Wi-Fi.
      • Justificativa para visita: [[justificativa]]

      AGENDAMENTO
      • Disponibilidade do Cliente: [[turno]]
      • Observações Adicionais: [[obs]]
      
      SOLUÇÃO
      • Chamado aberto e encaminhado para a equipe de Agendamento/Campo.
    form_fields:
      canal:
        type: choice
        values:
          - Blip
          - Ligação
          - E-mail
      solicitante:
        type: text
      contato:
        type: text
      justificativa:
        type: choice
        values:
          - Acesso remoto indisponível (equipamento sem gerência externa).
          - Cliente não conseguiu realizar o procedimento via instrução remota.
          - Equipamento sofreu reset e perdeu as configurações.
      turno:
        type: choice
        values:
          - Qualquer horário
          - Manhã (08h às 12h)
          - Tarde (13h às 18h)
      obs:
        type: text
        multiline: true

  # /logonline — Log de confirmação de sinal restaurado após reparo
  - trigger: "/logonline"
    form: |
      Sinal Restaurado — Confirmação com Cliente
      
      INFORMAÇÕES
      • Canal de Atendimento: [[canal]]
      • Contexto: [[contexto]]
      
      PROCEDIMENTOS
      • Monitoramento NOC confirmou sinal normalizado.
      • Cliente orientado a reiniciar equipamentos e validar navegação.
      
      SOLUÇÃO
      • Retorno do cliente: [[status]]
    form_fields:
      canal:
        type: choice
        values:
          - Blip
          - Ligação
          - E-mail
      contexto:
        type: choice
        values:
          - Reparo de rompimento concluído
          - Ocorrência massiva resolvida
          - Reconfiguração remota da ONU
      status:
        type: choice
        values:
          - Conexão normalizada. Chamado encerrado.
          - Falha persiste — escalonado para campo.
          - Cliente não retornou após orientação.

# /solicitacomp — Cliente bloqueado informa que já pagou; solicita o comprovante para liberação
  - trigger: "/solcomp"
    force_clipboard: true
    replace: |-
      Compreendo! Como o pagamento já foi realizado, é provável que o sistema ainda esteja aguardando o prazo de compensação bancária.
      
      Para agilizarmos o processo, por gentileza, envie o comprovante de pagamento (foto, print ou PDF) por aqui. 
      
      Assim que recebermos, faremos a validação, anexaremos ao seu cadastro e daremos andamento imediato na liberação dos seus serviços.

# /power — Orienta verificação da fonte de alimentação e troca de tomada
  - trigger: "/power"
    force_clipboard: true
    replace: |-
      Por favor, verifique se o cabo da fonte de energia está bem encaixado na parte de trás do equipamento e também na tomada.

      Para descartarmos mau contato ou falha na rede elétrica, tire o aparelho da tomada por 1 minuto. Em seguida, ligue-o novamente, mas de preferência em uma tomada diferente (direto na parede, sem o uso de réguas, benjamins ou filtros de linha).

      Esses cuidados ajudam bastante na nossa análise. Me avise assim que fizer o teste, por gentileza! ✅

  # /luzpower — Explica falha elétrica/hardware e abre chamado para visita técnica
  - trigger: "/luzpower"
    force_clipboard: true
    replace: |-
      Como o equipamento apresenta apenas a luz "Power" acesa/piscando mesmo após os testes na tomada, isso indica uma falha no fornecimento de energia ou um travamento de hardware. O defeito pode estar na fonte de alimentação (que não envia a voltagem correta) ou no próprio aparelho, impedindo que o sistema inicie.

      Para solucionar isso de forma definitiva, vou registrar uma visita técnica. Nossa equipe irá até o local para avaliar o equipamento e realizar a troca da fonte ou do modem para restabelecer a sua conexão.

  # /logpower — Log de abertura de visita técnica por falha elétrica (Luz Power / Hardware)
  - trigger: "/logpower"
    form: |
      Motivo da Visita: [[problema]]

      PROCEDIMENTOS REALIZADOS
      • Orientações Passadas: Solicitado o reinício elétrico (1 minuto fora da tomada), troca de tomada (direto na parede) e verificação física do encaixe da fonte.
      • Retorno do Cliente: Testes realizados, mas a falha persiste. Equipamento não inicia o sistema lógico. Suspeita de falha na fonte de alimentação ou defeito no hardware da ONU.
      • Evidências: [[evidencias]]

      Endereço Confirmado: [[endereco]]
      Disponibilidade: [[disponibilidade]]
    form_fields:
      problema:
        type: choice
        values:
          - Luz Power Piscando
          - Somente Luz Power Acesa Constante
      evidencias:
        type: choice
        values:
          - Foto recebida anexada ao chamado.
          - Relato descritivo do cliente no chat.

# /confirmacanc — Informa os próximos passos após a abertura do chamado de cancelamento
  - trigger: "/canc"
    force_clipboard: true
    replace: |-
      A sua solicitação de cancelamento foi registrada e encaminhada com sucesso para o nosso setor Financeiro.
      
      Conforme o nosso procedimento, a equipe financeira entrará em contato com você em até 24 horas úteis para dar prosseguimento ao atendimento.
      
      Eles serão os responsáveis por repassar todas as informações finais e aprofundar assuntos como faturas proporcionais, detalhes contratuais e os trâmites para a devolução dos equipamentos.
      
      Vale lembrar que o seu serviço continuará ativo até a finalização completa do processo de cancelamento junto ao Financeiro.
      
      Posso te auxiliar em algo mais por enquanto?
