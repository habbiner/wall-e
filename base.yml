      Este procedimento visa melhorar a performance e a segurança do seu serviço. Na grande maioria dos casos, as credenciais de acesso (cPanel, e-mails, FTP, banco de dados) não sofrem alterações.

      Você autoriza a execução desta migração? Se sim, por favor, confirme o melhor dia e horário para realizarmos o procedimento (recomendamos a execução fora do horário comercial para minimizar impactos).

